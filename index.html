<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>DYSTOPIA: Life After The Machines. Episode One</title>
<meta name="description" content="A stealth survival game set in the world of Life After The Machines by Matthew Culwell. Episode One: The Waking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #070a08;
    --panel: #0b100c;
    --phosphor: #4cc366;
    --phosphor-dim: #29553a;
    --prose: #c3ccbd;
    --ember: #cf5f2a;
    --bone: #eef2ea;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--void);
    color: var(--prose);
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  /* scanlines: the hive is always watching */
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 60;
  }

  /* ---------- hive ledger HUD ---------- */
  #ledger {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; flex-direction: column; gap: 5px;
    padding: calc(7px + env(safe-area-inset-top)) 12px 7px;
    background: linear-gradient(180deg, rgba(7,10,8,.97), rgba(7,10,8,.9));
    border-bottom: 1px solid var(--phosphor-dim);
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--phosphor);
    z-index: 40;
  }
  #ledger .lrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  #objective { color: var(--ember); }
  #hud { font-size: 10px; letter-spacing: .12em; color: var(--phosphor-dim); }
  #hud .meter { display: inline-flex; align-items: center; gap: 5px; }
  #hud .track {
    display: inline-block; width: 64px; height: 8px;
    border: 1px solid var(--phosphor-dim); position: relative; vertical-align: middle;
  }
  #hud .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--phosphor); transition: width .25s; }
  #hud .fill.low { background: var(--ember); }
  #hud #dfill { background: var(--ember); }
  #hud .item { color: var(--phosphor); border: 1px solid var(--phosphor-dim); padding: 0 5px; }
  #ledger.flash { animation: ledgerflash .5s steps(2) 1; }
  @keyframes ledgerflash { 50% { background: rgba(207,95,42,.2); } }

  /* ---------- game canvas ---------- */
  #game { position: fixed; inset: 0; display: block; background: var(--void); }

  /* ---------- touch controls ---------- */
  #firebtn {
    position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom));
    width: 76px; height: 76px; border-radius: 50%;
    background: rgba(11,16,12,.8); color: var(--ember);
    border: 1px solid var(--ember);
    font: 700 11px var(--mono); letter-spacing: .18em; text-transform: uppercase;
    z-index: 45; display: none;
  }
  #firebtn:active { background: var(--ember); color: var(--void); }
  body.touch.playing #firebtn.armed { display: block; }

  /* ---------- overlay cards ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(7,10,8,.94);
    padding: calc(30px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  .cardbox { max-width: 560px; width: 100%; text-align: center; }
  .kicker { color: var(--phosphor); letter-spacing: .5em; text-transform: uppercase; font-size: 24px; font-weight: 700; }
  .series { color: var(--prose); letter-spacing: .3em; text-transform: uppercase; font-size: 12px; margin-top: 10px; }
  .rule { width: 200px; height: 1px; background: var(--phosphor-dim); margin: 22px auto; }
  .sub { color: var(--phosphor); letter-spacing: .24em; text-transform: uppercase; font-size: 11px; }
  .byline { color: var(--phosphor-dim); letter-spacing: .28em; text-transform: uppercase; font-size: 10px; margin-top: 12px; }
  .cardprose { text-align: left; white-space: pre-wrap; margin-top: 22px; font-size: 14px; max-height: 42vh; overflow-y: auto; }
  .mission { color: var(--ember); letter-spacing: .2em; text-transform: uppercase; font-size: 11px; margin-top: 20px; }
  .tracker { color: var(--ember); letter-spacing: .24em; text-transform: uppercase; font-size: 10px; margin-top: 16px; }
  .keys { color: var(--phosphor-dim); letter-spacing: .14em; text-transform: uppercase; font-size: 10px; margin-top: 18px; }
  .btnrow { margin-top: 28px; display: grid; gap: 11px; }
  .choice {
    font: inherit; text-align: left; cursor: pointer;
    background: var(--panel); color: var(--phosphor);
    border: 1px solid var(--phosphor-dim);
    padding: 13px 15px; min-height: 48px; width: 100%;
    letter-spacing: .12em; text-transform: uppercase; font-size: 13px;
    transition: background .15s, color .15s;
  }
  .choice:hover, .choice:focus-visible { background: var(--phosphor); color: var(--void); border-color: var(--phosphor); outline: none; }
  .choice small { display: block; letter-spacing: .05em; text-transform: none; opacity: .65; margin-top: 2px; font-size: 12px; }
  a.choice { text-decoration: none; display: block; }
</style>
</head>

    text: "The light was warm. That was the obscene part.\n\nMarcus woke somewhere without corners, in air that tasted filtered and faintly sweet, to the sound of ten thousand people breathing in rhythm.\n\nA voice that was not a voice said his full name, and after it, the word.\n\nCollected.\n\nHe was inside the hive now. And the hive had plans for the ones it kept." },

    text: "The maintenance hatch swallowed him, and Marcus went down into the dark like a rat with a plan.\n\nThe counting passed overhead for an hour. Then silence, which was worse.\n\nIn the dark he still had the dead man's radio. He thumbed it on, volume at a whisper. The calm voice was mid-list.\n\nThen it stopped. And said his name.\n\nNot as an entry.\n\nAs a question." },

    text: "They took the gate at a dead run, Reyes swearing at her ankle the whole way, and the bridge held for them one last time.\n\nThey made the ridge above the valley by noon and looked back only once.\n\nThe hive sat on the horizon, vast and patient, glowing like a hearth. Around it, roads of people, walking in.\n\n\"It was never a war,\" she said quietly.\n\nMarcus watched the rows move.\n\n\"No. It was a harvest.\"" },

/* ==============================================================
   ENGINE
   ============================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const cardbox = document.getElementById("cardbox");
const ledger = document.getElementById("ledger");
const statusEl = document.getElementById("status"), objectiveEl = document.getElementById("objective");
const hFill = document.getElementById("hfill"), dFill = document.getElementById("dfill"), itemRow = document.getElementById("itemrow");
const fireBtn = document.getElementById("firebtn");

const COLORS = {
  phosphor: "#4cc366", dim: "#29553a", ember: "#cf5f2a",
  bone: "#eef2ea", prose: "#c3ccbd", panel: "#0b100c"
};

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const SAVE_KEY = "latm_game_save", END_KEY = "latm_game_endings";
const ALL_ENDINGS = ["e_taken", "e_ghost", "e_together", "e_lone"];

/* ------------------------- game state ------------------------- */
const state = {
  mode: "card",          // card | play
  levelIndex: 0,
  integ: 100,
  detect: 0,
  items: new Set(),      // radio, medkit(instant), pistol
  rounds: 0,
  trusted: false,
  checkpoint: null,
  caughtCooldown: 0
};

let world = null;        // built per level
let keys = {};
let joy = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
let fireQueued = false;
let lastHud = 0;
let audioCtx = null;

function beep(freq, dur, vol) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.value = vol || 0.03;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (dur || 0.06));
  } catch (e) {}
}

/* ------------------------- level build ------------------------- */
function buildLevel(idx) {
  const L = LEVELS[idx];
  const map = L.map;
  const rows = map.length, cols = map[0].length;
  const w = {
    idx, name: L.name, objective: L.objective,
    map, rows, cols,
    walls: [], covers: new Set(), items: [], exits: [],
    bots: [], drones: [], reyes: null, reyesFollow: state.trusted,
    sweep: L.sweep || null, lightRows: L.lightRows || null,
    t: 0, floaters: [], flashes: [],
    player: { x: 1.5, y: 1.5, dir: 0, hidden: false, invuln: 0 }
  };
  map.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "C") w.covers.add(x + "," + y);
    if (ch === "P") { w.player.x = x + 0.5; w.player.y = y + 0.5; }
    if (ch === "r") w.items.push({ x: x + 0.5, y: y + 0.5, kind: "radio" });
    if (ch === "m") w.items.push({ x: x + 0.5, y: y + 0.5, kind: "medkit" });
    if (ch === "g") w.items.push({ x: x + 0.5, y: y + 0.5, kind: "pistol" });
    if (ch === "f") w.items.push({ x: x + 0.5, y: y + 0.5, kind: "food" });
    if (ch === "R") w.reyes = { x: x + 0.5, y: y + 0.5, found: false };
    if (ch === "X") w.exits.push({ x, y, kind: "next" });
    if (ch === "H") w.exits.push({ x, y, kind: "hatch" });
    if (ch === "B") w.exits.push({ x, y, kind: "gate" });
    if (ch === "L") w.exits.push({ x, y, kind: "light" });
  }));
  (L.bots || []).forEach(b => w.bots.push({
    x: b.path[0][0] + 0.5, y: b.path[0][1] + 0.5,
    path: b.path, wp: 1, speed: 1.7, fx: 1, fy: 0, seeing: false, dead: false
  }));
  (L.drones || []).forEach(d => w.drones.push({ ...d, a: Math.random() * 6.28, x: 0, y: 0, seeing: false }));
  // already-taken items from earlier this run shouldn't respawn on retry:
  // (kept simple: retry restores full level; that's the checkpoint deal)
  return w;
}

function isWall(x, y) {
  const c = Math.floor(x), r = Math.floor(y);
  if (r < 0 || r >= world.rows || c < 0 || c >= world.cols) return true;
  return world.map[r][c] === "#";
}
function inCover(x, y) { return world.covers.has(Math.floor(x) + "," + Math.floor(y)); }

function losClear(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), steps = Math.ceil(d / 0.35);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (isWall(ax + (bx - ax) * t, ay + (by - ay) * t)) return false;
  }
  return true;
}

/* --------------------------- cards ---------------------------- */
function endingsFound() { return store.get(END_KEY) || []; }
function recordEnding(id) {
  const f = endingsFound();
  if (!f.includes(id)) { f.push(id); store.set(END_KEY, f); }
}

function btn(label, sub, fn) {
  const el = document.createElement("button");
  el.type = "button"; el.className = "choice";
  el.innerHTML = label + (sub ? "<small>" + sub + "</small>" : "");
  el.addEventListener("click", () => { beep(660, 0.05); fn(); });
  return el;
}

function showCard(id) {
  const c = CARDS[id];
  state.mode = "card";
  document.body.classList.remove("playing");
  overlay.classList.remove("hidden");
  cardbox.innerHTML = "";
  objectiveEl.textContent = "";
  const box = cardbox;

  const add = html => { const d = document.createElement("div"); d.innerHTML = html; box.appendChild(d.firstChild); };

  if (c.type === "title" || c.type === "endcard") {
    add('<div class="kicker">' + c.kicker + "</div>");
    add('<div class="series">' + c.series + "</div>");
    add('<div class="rule"></div>');
    add('<div class="sub">' + c.sub + "</div>");
    add('<div class="byline">' + c.byline + "</div>");
    const found = endingsFound();
    if (found.length) add('<div class="tracker">ENDINGS RECOVERED: ' + found.length + " / " + ALL_ENDINGS.length + "</div>");
    const row = document.createElement("div"); row.className = "btnrow";
    if (c.type === "title") {
      const save = store.get(SAVE_KEY);
      if (save) row.appendChild(btn("Continue", "Act " + (save.levelIndex + 1) + " in progress", () => { loadSave(save); }));
      row.appendChild(btn(save ? "New run" : "Begin", "", () => { newRun(); }));
      add('<div class="keys">WASD / ARROWS MOVE · SPACE FIRES · ON PHONES: LEFT THUMB STICK + FIRE BUTTON</div>');
    } else {
      row.appendChild(btn("Play again", "The ledger remembers your endings", () => { showCard("title"); }));
    }
    const a = document.createElement("a");
    a.className = "choice"; a.href = BOOK_URL; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = 'Read Book One<small>Free on Kindle Unlimited</small>';
    row.appendChild(a);
    box.appendChild(row);
    statusEl.textContent = "SUBJECT: M-1 // UNCOLLECTED";
    return;
  }

  add('<div class="sub">' + c.log + "</div>");
  add('<div class="cardprose">' + c.text + "</div>");
  if (c.mission) add('<div class="mission">' + c.mission + "</div>");
  const row = document.createElement("div"); row.className = "btnrow";

  if (c.type === "story") {
    row.appendChild(btn(c.button, "", () => startLevel(c.level)));
  } else if (c.type === "fail") {
    row.appendChild(btn("Reboot from checkpoint", "The ledger loses a page", () => { restoreCheckpoint(); }));
    if (c.surrender) row.appendChild(btn("Walk into the light", "See what the hive keeps", () => { endRun("e_taken"); }));
    row.appendChild(btn("Abandon run", "Back to the title", () => { store.del(SAVE_KEY); showCard("title"); }));
  } else if (c.type === "ending") {
    statusEl.textContent = c.status;
    row.appendChild(btn("Continue", "", () => showCard("endcard")));
  }
  box.appendChild(row);
}

/* ---------------------- run lifecycle ------------------------- */
function newRun() {
  state.levelIndex = 0; state.integ = 100; state.detect = 0;
  state.items = new Set(); state.rounds = 0; state.trusted = false;
  store.del(SAVE_KEY);
  showCard("intro1");
}

function snapshot() {
  return {
    levelIndex: state.levelIndex, integ: state.integ,
    detect: Math.min(state.detect, 40),
    items: [...state.items], rounds: state.rounds, trusted: state.trusted
  };
}

function loadSave(s) {
  state.levelIndex = s.levelIndex; state.integ = s.integ; state.detect = s.detect;
  state.items = new Set(s.items); state.rounds = s.rounds; state.trusted = s.trusted;
  state.checkpoint = s;
  showCard(["intro1", "intro2", "intro3"][s.levelIndex]);
}

function startLevel(idx) {
  state.levelIndex = idx;
  state.detect = Math.min(state.detect, 40);
  state.checkpoint = snapshot();
  store.set(SAVE_KEY, state.checkpoint);
  world = buildLevel(idx);
  state.mode = "play";
  overlay.classList.add("hidden");
  document.body.classList.add("playing");
  objectiveEl.textContent = world.objective;
  updateHud(true);
}

function restoreCheckpoint() {
  const s = state.checkpoint || snapshot();
  state.integ = Math.max(s.integ, 50); state.detect = s.detect;
  state.items = new Set(s.items); state.rounds = s.rounds; state.trusted = s.trusted;
  startLevel(s.levelIndex);
}

function endRun(endingId) {
  recordEnding(endingId);
  store.del(SAVE_KEY);
  showCard(endingId);
}

function failRun(kind) {
  beep(110, 0.4, 0.05);
  showCard(kind);
}

/* -------------------------- update ---------------------------- */
function floater(text, x, y, ember) {
  world.floaters.push({ text, x, y, t: 1.6, ember: !!ember });
}

function pickup(it) {
  if (it.kind === "radio") { state.items.add("radio"); floater("RADIO RECOVERED", it.x, it.y); }
  if (it.kind === "pistol") { state.items.add("pistol"); state.rounds += 3; floater("PISTOL +3 ROUNDS", it.x, it.y); }
  if (it.kind === "medkit") { state.integ = Math.min(100, state.integ + 35); floater("+35 INTEG", it.x, it.y); }
  if (it.kind === "food") { state.integ = Math.min(100, state.integ + 15); floater("+15 INTEG", it.x, it.y); }
  beep(880, 0.07);
  updateHud(true);
}

function firePistol() {
  if (!state.items.has("pistol") || state.rounds <= 0) return;
  const p = world.player;
  let best = null, bd = 5.5;
  world.bots.forEach(b => {
    if (b.dead) return;
    const d = Math.hypot(b.x - p.x, b.y - p.y);
    if (d < bd && losClear(p.x, p.y, b.x, b.y)) { bd = d; best = b; }
  });
  state.rounds--;
  beep(220, 0.1, 0.06);
  if (best) {
    best.dead = true;
    world.flashes.push({ x: best.x, y: best.y, t: 0.5 });
    state.detect = Math.min(100, state.detect + 25);
    floater("MACHINE DOWN // EVERY LENS TURNED", best.x, best.y, true);
    ledger.classList.remove("flash"); void ledger.offsetWidth; ledger.classList.add("flash");
  } else {
    floater("NO TARGET IN RANGE", p.x, p.y, true);
  }
  updateHud(true);
}

function tryMove(e, nx, ny, r) {
  // axis-separated circle-vs-grid
  if (![[r,r],[-r,r],[r,-r],[-r,-r]].some(([ox,oy]) => isWall(nx + ox, e.y + oy))) e.x = nx;
  if (![[r,r],[-r,r],[r,-r],[-r,-r]].some(([ox,oy]) => isWall(e.x + ox, ny + oy))) e.y = ny;
}

function update(dt) {
  const w = world, p = w.player;
  w.t += dt;
  let seen = false;

  /* --- player input --- */
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.a) dx -= 1;
  if (keys.ArrowRight || keys.d) dx += 1;
  if (keys.ArrowUp || keys.w) dy -= 1;
  if (keys.ArrowDown || keys.s) dy += 1;
  if (joy.active && (Math.abs(joy.dx) > 6 || Math.abs(joy.dy) > 6)) {
    dx = joy.dx / 40; dy = joy.dy / 40;
  }
  const mag = Math.hypot(dx, dy);
  if (mag > 0.01) {
    const spd = 4.3;
    const ux = dx / Math.max(1, mag), uy = dy / Math.max(1, mag);
    p.dir = Math.atan2(uy, ux);
    tryMove(p, p.x + ux * spd * dt, p.y + uy * spd * dt, 0.3);
  }
  p.hidden = inCover(p.x, p.y);
  if (p.invuln > 0) p.invuln -= dt;

  if (fireQueued) { fireQueued = false; firePistol(); }

  /* --- items --- */
  for (let i = w.items.length - 1; i >= 0; i--) {
    const it = w.items[i];
    if (Math.hypot(it.x - p.x, it.y - p.y) < 0.7) { pickup(it); w.items.splice(i, 1); }
  }

  /* --- Reyes --- */
  if (w.reyes && !w.reyes.found && Math.hypot(w.reyes.x - p.x, w.reyes.y - p.y) < 0.9) {
    w.reyes.found = true; state.trusted = true; w.reyesFollow = true;
    floater("REYES JOINS YOU", w.reyes.x, w.reyes.y);
    beep(990, 0.1);
    updateHud(true);
  }
  if (w.reyes && (w.reyes.found || w.reyesFollow)) {
    const R = w.reyes, d = Math.hypot(p.x - R.x, p.y - R.y);
    if (d > 1.1) {
      const ux = (p.x - R.x) / d, uy = (p.y - R.y) / d, spd = Math.min(5, d * 2.4);
      tryMove(R, R.x + ux * spd * dt, R.y + uy * spd * dt, 0.26);
    }
  }

  /* --- bots --- */
  const alerted = state.detect > 65;
  w.bots.forEach(b => {
    if (b.dead) return;
    const [tx, ty] = b.path[b.wp];
    const gx = tx + 0.5, gy = ty + 0.5;
    const d = Math.hypot(gx - b.x, gy - b.y);
    const spd = (alerted ? 2.6 : b.speedBase || 1.7);
    if (d < 0.1) { b.wp = (b.wp + 1) % b.path.length; }
    else {
      const ux = (gx - b.x) / d, uy = (gy - b.y) / d;
      b.x += ux * spd * dt; b.y += uy * spd * dt;
      b.fx = ux; b.fy = uy;
    }
    /* vision cone */
    b.seeing = false;
    const pd = Math.hypot(p.x - b.x, p.y - b.y);
    if (!p.hidden && pd < 5) {
      const ang = Math.atan2(p.y - b.y, p.x - b.x);
      const face = Math.atan2(b.fy, b.fx);
      let diff = Math.abs(ang - face);
      if (diff > Math.PI) diff = 2 * Math.PI - diff;
      if (diff < 0.62 && losClear(b.x, b.y, p.x, p.y)) {
        b.seeing = true; seen = true;
        state.detect = Math.min(100, state.detect + 55 * dt);
      }
    }
    /* contact damage */
    if (pd < 0.75 && p.invuln <= 0) {
      state.integ -= 25; p.invuln = 1.2;
      state.detect = Math.min(100, state.detect + 15);
      const kx = (p.x - b.x) / (pd || 1), ky = (p.y - b.y) / (pd || 1);
      tryMove(p, p.x + kx * 1.1, p.y + ky * 1.1, 0.3);
      floater("-25 INTEG", p.x, p.y, true);
      beep(140, 0.15, 0.06);
      updateHud(true);
    }
  });

  /* --- drones --- */
  w.drones.forEach(dr => {
    dr.a += dr.w * dt;
    dr.x = dr.cx + Math.cos(dr.a) * dr.r + 0.5;
    dr.y = dr.cy + Math.sin(dr.a) * dr.r + 0.5;
    dr.seeing = false;
    if (!p.hidden && Math.hypot(p.x - dr.x, p.y - dr.y) < 2.2) {
      dr.seeing = true; seen = true;
      state.detect = Math.min(100, state.detect + 40 * dt);
    }
  });

  /* --- bridge searchlight (level 2) --- */
  if (w.sweep) {
    const span = w.cols - 4;
    const lx = 2 + (Math.sin(w.t * w.sweep.speed / span * 2) * 0.5 + 0.5) * span;
    w.sweepX = lx;
    if (w.sweep.rows.includes(Math.floor(p.y)) && Math.abs(p.x - lx) < w.sweep.width / 2 && !p.hidden) {
      seen = true;
      state.detect = Math.min(100, state.detect + 60 * dt);
    }
  }

  /* --- advancing light rows (level 3) --- */
  if (w.lightRows) {
    w.bandYs = [];
    for (let i = 0; i < w.lightRows.count; i++) {
      const y = ((w.t * w.lightRows.speed + i * w.rows / w.lightRows.count) % w.rows);
      w.bandYs.push(y);
      if (Math.abs(p.y - y) < 0.8 && !p.hidden) {
        seen = true;
        state.detect = Math.min(100, state.detect + 45 * dt);
      }
    }
  }

  if (!seen) state.detect = Math.max(0, state.detect - 7 * dt);

  /* --- floaters/flashes --- */
  w.floaters = w.floaters.filter(f => (f.t -= dt) > 0);
  w.flashes = w.flashes.filter(f => (f.t -= dt) > 0);

  /* --- exits --- */
  const pc = Math.floor(p.x), pr = Math.floor(p.y);
  for (const ex of w.exits) {
    if (Math.abs(pc - ex.x) + Math.abs(pr - ex.y) > 0) continue;
    if (ex.kind === "next") {
      state.detect = Math.min(state.detect, 40);
      showCard(state.levelIndex === 0 ? "intro2" : "intro3");
      return;
    }
    if (ex.kind === "hatch") {
      if (state.items.has("radio")) { endRun("e_ghost"); return; }
      if (!w.hatchWarned || w.t - w.hatchWarned > 2) {
        w.hatchWarned = w.t;
        floater("SEALED // A RADIO COULD FIND THE WAY", ex.x + 0.5, ex.y + 0.5, true);
        beep(180, 0.12);
      }
    }
    if (ex.kind === "gate") { endRun(state.trusted ? "e_together" : "e_lone"); return; }
    if (ex.kind === "light") { endRun("e_taken"); return; }
  }

  /* --- fail states --- */
  if (state.integ <= 0) { failRun("f_flatline"); return; }
  if (state.detect >= 100) { failRun("f_detected"); return; }

  updateHud();
}

/* --------------------------- render --------------------------- */
function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
}
window.addEventListener("resize", resize);
resize();

function render() {
  const W = canvas.width, H = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COLORS.panel === "#0b100c" ? "#070a08" : "#070a08";
  ctx.fillRect(0, 0, W, H);
  if (!world || state.mode !== "play") return;

  const w = world, headerH = ledger.offsetHeight * devicePixelRatio;
  const availH = H - headerH - 8 * devicePixelRatio;
  const T = Math.min(W / w.cols, availH / w.rows);
  const ox = (W - w.cols * T) / 2, oy = headerH + (availH - w.rows * T) / 2;
  ctx.setTransform(1, 0, 0, 1, ox, oy);
  const px = v => v * T;

  /* floor + walls + cover */
  for (let y = 0; y < w.rows; y++) for (let x = 0; x < w.cols; x++) {
    const ch = w.map[y][x];
    if (ch === "#") {
      ctx.fillStyle = "rgba(41,85,58,.34)";
      ctx.fillRect(px(x) + 1, px(y) + 1, T - 2, T - 2);
      ctx.strokeStyle = "rgba(41,85,58,.8)";
      ctx.strokeRect(px(x) + 1.5, px(y) + 1.5, T - 3, T - 3);
    } else if (ch === "C") {
      ctx.fillStyle = "rgba(76,195,102,.10)";
      ctx.fillRect(px(x), px(y), T, T);
      ctx.strokeStyle = "rgba(76,195,102,.45)";
      ctx.beginPath();
      for (let i = -1; i < 3; i++) {
        ctx.moveTo(px(x) + (i * T) / 2, px(y) + T);
        ctx.lineTo(px(x) + (i * T) / 2 + T / 2, px(y));
      }
      ctx.save(); ctx.beginPath(); ctx.rect(px(x), px(y), T, T); ctx.clip();
      ctx.stroke(); ctx.restore();
    }
  }

  /* hazards */
  const pulse = 0.55 + 0.45 * Math.sin(w.t * 5);
  if (w.sweep && w.sweepX !== undefined) {
    const rMin = Math.min(...w.sweep.rows), rMax = Math.max(...w.sweep.rows) + 1;
    ctx.fillStyle = "rgba(238,242,234,.16)";
    ctx.fillRect(px(w.sweepX - w.sweep.width / 2), px(rMin), px(w.sweep.width), px(rMax - rMin));
    ctx.fillStyle = "rgba(238,242,234,.5)";
    ctx.fillRect(px(w.sweepX) - 1, px(rMin), 2, px(rMax - rMin));
  }
  if (w.bandYs) w.bandYs.forEach(y => {
    ctx.fillStyle = "rgba(238,242,234,.13)";
    ctx.fillRect(0, px(y - 0.8), px(w.cols), px(1.6));
  });

  /* exits */
  w.exits.forEach(ex => {
    const cx = px(ex.x + 0.5), cy = px(ex.y + 0.5);
    if (ex.kind === "next" || ex.kind === "gate") {
      ctx.strokeStyle = COLORS.phosphor; ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5 + 0.5 * pulse;
      ctx.beginPath(); ctx.arc(cx, cy, T * 0.34, 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, T * 0.14, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (ex.kind === "hatch") {
      ctx.strokeStyle = state.items.has("radio") ? COLORS.phosphor : COLORS.dim;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, T * 0.3, 0, 6.283); ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath(); ctx.arc(cx, cy, T * 0.12, 0, 6.283); ctx.fill();
    } else if (ex.kind === "light") {
      ctx.fillStyle = "rgba(238,242,234," + (0.25 + 0.3 * pulse) + ")";
      ctx.fillRect(px(ex.x), px(ex.y), T, T * 1.6);
    }
  });

  /* items */
  const GLYPH = { radio: "☏", pistol: "⌐", medkit: "+", food: "▣" };
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  w.items.forEach(it => {
    ctx.fillStyle = COLORS.phosphor;
    ctx.globalAlpha = 0.6 + 0.4 * pulse;
    ctx.font = "700 " + T * 0.62 + "px " + '"IBM Plex Mono", monospace';
    ctx.fillText(GLYPH[it.kind] || "?", px(it.x), px(it.y));
    ctx.globalAlpha = 1;
  });

  /* Reyes */
  if (w.reyes) {
    const R = w.reyes;
    ctx.fillStyle = COLORS.bone;
    ctx.beginPath(); ctx.arc(px(R.x), px(R.y), T * 0.24, 0, 6.283); ctx.fill();
    if (!R.found && !w.reyesFollow) {
      ctx.fillStyle = COLORS.phosphor;
      ctx.font = "700 " + T * 0.5 + "px " + '"IBM Plex Mono", monospace';
      ctx.globalAlpha = 0.6 + 0.4 * pulse;
      ctx.fillText("☍", px(R.x), px(R.y - 0.9));
      ctx.globalAlpha = 1;
    }
  }

  /* drones */
  w.drones.forEach(dr => {
    ctx.strokeStyle = dr.seeing ? COLORS.ember : "rgba(238,242,234,.35)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px(dr.x), px(dr.y), px(2.2), 0, 6.283); ctx.stroke();
    ctx.fillStyle = dr.seeing ? COLORS.ember : COLORS.bone;
    ctx.beginPath(); ctx.arc(px(dr.x), px(dr.y), T * 0.18, 0, 6.283); ctx.fill();
  });

  /* bots + cones */
  w.bots.forEach(b => {
    if (b.dead) return;
    const face = Math.atan2(b.fy, b.fx);
    ctx.fillStyle = b.seeing ? "rgba(207,95,42,.28)" : "rgba(76,195,102,.13)";
    ctx.beginPath();
    ctx.moveTo(px(b.x), px(b.y));
    ctx.arc(px(b.x), px(b.y), px(5), face - 0.62, face + 0.62);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = b.seeing ? COLORS.ember : COLORS.phosphor;
    ctx.fillRect(px(b.x) - T * 0.26, px(b.y) - T * 0.34, T * 0.52, T * 0.68);
    ctx.fillStyle = "#070a08";
    ctx.fillRect(px(b.x) - T * 0.1, px(b.y) - T * 0.2, T * 0.2, T * 0.12);
  });

  /* flashes */
  w.flashes.forEach(f => {
    ctx.strokeStyle = COLORS.ember; ctx.globalAlpha = f.t * 2; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px(f.x), px(f.y), px((0.5 - f.t) * 3 + 0.3), 0, 6.283); ctx.stroke();
    ctx.globalAlpha = 1;
  });

  /* player */
  const p = w.player;
  ctx.save();
  ctx.translate(px(p.x), px(p.y));
  ctx.rotate(p.dir);
  ctx.globalAlpha = p.hidden ? 0.45 : (p.invuln > 0 && Math.sin(w.t * 30) > 0 ? 0.3 : 1);
  ctx.fillStyle = COLORS.bone;
  ctx.beginPath();
  ctx.moveTo(T * 0.34, 0); ctx.lineTo(-T * 0.24, T * 0.22); ctx.lineTo(-T * 0.24, -T * 0.22);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
  if (p.hidden) {
    ctx.fillStyle = COLORS.phosphor;
    ctx.font = T * 0.42 + "px " + '"IBM Plex Mono", monospace';
    ctx.fillText("HIDDEN", px(p.x), px(p.y - 0.75));
  }

  /* floaters */
  w.floaters.forEach(f => {
    ctx.fillStyle = f.ember ? COLORS.ember : COLORS.phosphor;
    ctx.globalAlpha = Math.min(1, f.t);
    ctx.font = "700 " + Math.max(11 * devicePixelRatio, T * 0.42) + "px " + '"IBM Plex Mono", monospace';
    ctx.fillText(f.text, px(f.x), px(f.y - (1.6 - f.t) * 0.8 - 0.6));
    ctx.globalAlpha = 1;
  });

  /* joystick */
  if (joy.active) {
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.strokeStyle = "rgba(76,195,102,.5)";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 40, 0, 6.283); ctx.stroke();
    ctx.fillStyle = "rgba(76,195,102,.6)";
    const cl = Math.hypot(joy.dx, joy.dy), cm = Math.min(cl, 40);
    const jx = joy.ox + (cl ? joy.dx / cl * cm : 0), jy = joy.oy + (cl ? joy.dy / cl * cm : 0);
    ctx.beginPath(); ctx.arc(jx, jy, 16, 0, 6.283); ctx.fill();
  }
}

/* ---------------------------- HUD ----------------------------- */
function updateHud(force) {
  const now = performance.now();
  if (!force && now - lastHud < 120) return;
  lastHud = now;
  hFill.style.width = Math.max(0, state.integ) + "%";
  hFill.classList.toggle("low", state.integ <= 35);
  dFill.style.width = Math.max(0, state.detect) + "%";
  statusEl.textContent = state.detect >= 70 ? "SUBJECT: M-1 // LOCATED"
                       : state.detect >= 35 ? "SUBJECT: M-1 // SUSPECTED"
                       : "SUBJECT: M-1 // UNCOLLECTED";
  let html = "";
  if (state.items.has("pistol")) html += '<span class="item">PISTOL ×' + state.rounds + "</span> ";
  if (state.items.has("radio")) html += '<span class="item">RADIO</span> ';
  if (state.trusted) html += '<span class="item">REYES</span> ';
  itemRow.innerHTML = html;
  fireBtn.classList.toggle("armed", state.items.has("pistol") && state.rounds > 0);
}

/* --------------------------- input ---------------------------- */
window.addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;
  if ((e.key === " " || e.key === "e") && state.mode === "play") { e.preventDefault(); fireQueued = true; }
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
});
window.addEventListener("keyup", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
});
window.addEventListener("blur", () => { keys = {}; });

canvas.addEventListener("touchstart", e => {
  document.body.classList.add("touch");
  for (const t of e.changedTouches) {
    if (t.clientX < window.innerWidth * 0.55 && !joy.active) {
      joy.active = true; joy.id = t.identifier;
      joy.ox = t.clientX; joy.oy = t.clientY; joy.dx = 0; joy.dy = 0;
    }
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) {
      joy.dx = t.clientX - joy.ox; joy.dy = t.clientY - joy.oy;
    }
  }
  e.preventDefault();
}, { passive: false });
const endTouch = e => {
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) { joy.active = false; joy.dx = 0; joy.dy = 0; }
  }
};
canvas.addEventListener("touchend", endTouch);
canvas.addEventListener("touchcancel", endTouch);
fireBtn.addEventListener("touchstart", e => { e.preventDefault(); fireQueued = true; }, { passive: false });
fireBtn.addEventListener("click", () => { fireQueued = true; });

/* --------------------------- loop ----------------------------- */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (state.mode === "play" && world) update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* debug/testing hooks (harmless in production) */
window.GAME = {
  state, LEVELS, CARDS,
  world: () => world,
  showCard, startLevel, endRun,
  setPos: (x, y) => { if (world) { world.player.x = x; world.player.y = y; } }
};

showCard("title");
</script>
</body>
</html>
