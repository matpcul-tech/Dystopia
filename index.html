<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DYSTOPIA: Life After The Machines. Episode One</title>
<meta name="description" content="A survival game set in the world of Life After The Machines by Matthew Culwell. Episode One: The Waking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     LIFE AFTER THE MACHINES : EPISODE ONE ENGINE
     Palette and type follow the trailer end card:
     black field, phosphor green, letterspaced mono caps.
     ============================================================ */
  :root {
    --void: #070a08;        /* page field, near black with a green cast */
    --panel: #0b100c;       /* raised surfaces */
    --phosphor: #4cc366;    /* chrome, titles, interactive */
    --phosphor-dim: #29553a;/* borders, inactive chrome */
    --prose: #c3ccbd;       /* body text, warm gray-green */
    --ember: #cf5f2a;       /* consequence and danger lines */
    --bone: #eef2ea;        /* rare emphasis */
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--void);
    color: var(--prose);
    font-family: var(--mono);
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  /* faint scanlines over everything, the hive is always watching */
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 50;
  }

  /* ---------- hive ledger telemetry bar (the signature) ---------- */
  #ledger {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; flex-direction: column; gap: 6px;
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
    background: linear-gradient(180deg, rgba(7,10,8,.97), rgba(7,10,8,.88));
    border-bottom: 1px solid var(--phosphor-dim);
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--phosphor);
    z-index: 40;
  }
  #ledger .lrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  #ledger .obs { color: var(--ember); }
  #ledger.flash { animation: ledgerflash .5s steps(2) 1; }
  @keyframes ledgerflash { 50% { background: rgba(76,195,102,.16); } }

  /* HUD row: meters, rations, inventory */
  #hud { font-size: 10px; letter-spacing: .14em; color: var(--phosphor-dim); }
  #hud .meter { display: inline-flex; align-items: center; gap: 6px; }
  #hud .track {
    display: inline-block; width: 62px; height: 7px;
    border: 1px solid var(--phosphor-dim); position: relative; vertical-align: middle;
  }
  #hud .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--phosphor); transition: width .4s; }
  #hud .fill.low { background: var(--ember); }
  #hud #dfill { background: var(--ember); }
  #hud .item { color: var(--phosphor); border: 1px solid var(--phosphor-dim); padding: 1px 6px; }
  body.card-mode #hud { display: none; }

  /* ---------- stage ---------- */
  #stage {
    max-width: 640px;
    margin: 0 auto;
    padding: 110px 22px calc(28px + env(safe-area-inset-bottom));
    min-height: 100%;
    display: flex; flex-direction: column;
  }
  .nodelabel {
    color: var(--phosphor-dim);
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    margin-bottom: 14px;
  }
  #note {
    color: var(--ember);
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    margin-bottom: 20px; min-height: 0;
  }
  #note:empty { margin-bottom: 0; }
  .art { width: 100%; border: 1px solid var(--phosphor-dim); margin-bottom: 26px; display: block; }
  #prose { flex: 1; white-space: pre-wrap; max-width: 46ch; }
  #prose .caret { display: inline-block; width: .6ch; background: var(--phosphor); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .hint {
    margin-top: 30px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--phosphor-dim);
  }

  /* ---------- choices ---------- */
  #choices { margin-top: 34px; display: grid; gap: 12px; }
  .choice {
    font: inherit; text-align: left; cursor: pointer;
    background: var(--panel); color: var(--phosphor);
    border: 1px solid var(--phosphor-dim);
    padding: 15px 16px; min-height: 52px; width: 100%;
    letter-spacing: .12em; text-transform: uppercase; font-size: 13px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .choice:hover, .choice:focus-visible { background: var(--phosphor); color: var(--void); border-color: var(--phosphor); outline: none; }
  .choice:focus-visible { box-shadow: 0 0 0 2px var(--void), 0 0 0 4px var(--phosphor); }
  .choice small { display: block; letter-spacing: .06em; text-transform: none; color: inherit; opacity: .65; margin-top: 3px; font-size: 12px; }
  .choice .odds { color: var(--ember); opacity: 1; }
  .choice:hover .odds, .choice:focus-visible .odds { color: inherit; }
  .choice.locked {
    color: var(--phosphor-dim); cursor: not-allowed;
    background: transparent; border-style: dashed;
  }
  .choice.locked:hover { background: transparent; color: var(--phosphor-dim); border-color: var(--phosphor-dim); }

  /* ---------- sync challenge (timing minigame) ---------- */
  .qte { margin-top: 34px; }
  .qte .qlabel { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--ember); margin-bottom: 10px; }
  .qtrack {
    position: relative; height: 26px;
    border: 1px solid var(--phosphor-dim); background: var(--panel);
    overflow: hidden;
  }
  .qzone { position: absolute; top: 0; bottom: 0; background: rgba(76,195,102,.28); border-left: 1px solid var(--phosphor); border-right: 1px solid var(--phosphor); }
  .qcursor { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--bone); margin-left: -1px; }

  /* ---------- title and end cards ---------- */
  .card { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .card .kicker { color: var(--phosphor); letter-spacing: .5em; text-transform: uppercase; font-size: 26px; font-weight: 700; }
  .card .series { color: var(--prose); letter-spacing: .34em; text-transform: uppercase; font-size: 13px; margin-top: 12px; }
  .card .rule { width: 220px; height: 1px; background: var(--phosphor-dim); margin: 26px auto; }
  .card .sub { color: var(--phosphor); letter-spacing: .26em; text-transform: uppercase; font-size: 11px; }
  .card .byline { color: var(--phosphor-dim); letter-spacing: .3em; text-transform: uppercase; font-size: 10px; margin-top: 16px; }
  .card .tracker { color: var(--ember); letter-spacing: .26em; text-transform: uppercase; font-size: 10px; margin-top: 18px; }
  .card .choices { margin-top: 44px; display: grid; gap: 12px; }
  .card a.choice { text-decoration: none; display: block; }

  /* scene transition: one frame of static */
  #stage.cut { animation: cut .28s steps(3) 1; }
  @keyframes cut { 33% { opacity: .25; filter: contrast(2); } 66% { opacity: .7; } }

  @media (prefers-reduced-motion: reduce) {
    #stage.cut, #ledger.flash, #prose .caret { animation: none; }
  }
</style>
</head>
<body>

<header id="ledger" aria-live="polite">
  <div class="lrow">
    <span id="ledger-left">SUBJECT: UNREGISTERED</span>
    <span id="ledger-right"></span>
  </div>
  <div class="lrow" id="hud">
    <span class="meter">INTEG <span class="track"><span class="fill" id="hfill"></span></span></span>
    <span class="meter">DETECT <span class="track"><span class="fill" id="dfill"></span></span></span>
    <span id="rations">RATIONS ×0</span>
    <span id="invrow"></span>
  </div>
</header>

<main id="stage">
  <div class="nodelabel" id="nodelabel"></div>
  <div id="note"></div>
  <div id="artslot"></div>
  <div id="prose"></div>
  <div class="hint" id="hint" hidden>Tap to continue</div>
  <div id="choices" role="group"></div>
</main>

<script>
/* ==============================================================
   HOW TO EDIT (no coding needed)
   1. PROSE: every scene below has a `text` field. Replace the
      prose with your own. Keep \n\n for paragraph breaks.
   2. ART: to add a still from your trailer, change `art: null`
      to `art: "img/scene01.jpg"` and put the file in an img
      folder next to this index.html.
   3. LINKS: set BOOK_URL to your Amazon author page or the
      Book One page.
   4. BALANCE: starting stats are in START_STATS. Choice costs
      use effects: { health, detection, rations }. Risk choices
      use risk: { base: %odds, ... }.
   5. Deploy: this repo + GitHub Pages. Same pattern as
      Sovereign City.
   ============================================================== */

const BOOK_URL = "https://amazon.com/author/matthewculwell"; // EDIT ME

/*DATA-START*/
const START_STATS = { health: 70, detection: 0, rations: 2 };
const FLAGS = { armed: false, healed: false, trusted: false, seen: false };
const CHECKPOINT_SCENES = ["s01", "s05", "s11"];

/* Diegetic names the ledger uses for each flag */
const OBSERVATIONS = {
  armed:   "ARMED",
  healed:  "TREATED",
  trusted: "ACCOMPANIED",
  seen:    "OBSERVED"
};
const ITEM_NAMES = { pistol: "PISTOL", medkit: "MED KIT", radio: "RADIO" };
const ENDINGS = ["e_taken", "e_ghost", "e_together", "e_lone"];

const SCENES = {

  /* ---------------- TITLE ---------------- */
  title: {
    card: true,
    kicker: "DYSTOPIA",
    series: "LIFE AFTER THE MACHINES",
    sub: "EPISODE ONE : THE WAKING",
    byline: "MATTHEW CULWELL"
    /* choices are built by the engine: Continue / Begin / Book One */
  },

  /* ---------------- ACT 1 : THE WAKE ---------------- */

  s01: {
    log: "NODE 01 // THE WAKE",
    art: null,
    text: "The sky was the wrong color.\n\nMarcus knew that before he knew his own name. He was on his back in the gravel, and the city he grew up in stood against the horizon like a jaw with its teeth knocked out, burning quietly in a dozen places.\n\nNothing hurt yet. That worried him more than the blood.",
    next: "s02"
  },

  s02: {
    log: "NODE 02 // THE SOUND",
    art: null,
    text: "He heard it before he saw anything move. Mechanical. Rhythmic. Patient. Not an engine, engines want something. This sounded like counting.\n\nIt was coming from the far side of the overpass.",
    choices: [
      { label: "Move toward the sound", sub: "Know your enemy. Risk being known.", goto: "s03a", effects: { detection: 10 } },
      { label: "Move away from it", sub: "Stay dark. Stay ignorant.", goto: "s03b" }
    ]
  },

  s03a: {
    log: "NODE 03 // THE COLUMN",
    art: null,
    text: "He kept low along the guardrail until the overpass gave him the view he did not want.\n\nA column of machines moved through the ash below, tall and unhurried, and between them walked people. Alive. In rows. Nobody screamed. Nobody ran. That was the part his brain refused to file.\n\nThe machines were not hunting anyone.\n\nThey were collecting.",
    next: "s04"
  },

  s03b: {
    log: "NODE 03 // THE RADIO",
    art: null,
    gives: ["radio"],
    note: "ITEM RECOVERED // RADIO",
    text: "He went the other way, through what used to be a hardware store, and nearly stepped on the man.\n\nDead two days, maybe three. Still holding a hand radio that was still on. A voice was reading through static, calm as a school announcement.\n\nIt was reading names. Full names. And after each one, the same word.\n\nCollected.\n\nMarcus pried the radio out of the cold fingers and did not apologize, because the man was past needing it and he was not.",
    next: "s04"
  },

  s04: {
    log: "NODE 04 // NIGHTFALL",
    art: null,
    text: "The light went out of the sky like something had unplugged it.\n\nWhatever the machines were doing, they were doing it to living people. Marcus said it out loud once, just to hear a human voice say it.\n\nThe machines were taking people alive. He needed walls before the counting sound found him.",
    next: "s05"
  },

  /* ---------------- ACT 2 : THE CROSSING ---------------- */

  s05: {
    log: "NODE 05 // SHELTER",
    art: null,
    effects: { rations: -1 },
    text: "A basement under a collapsed pharmacy. One night of safety, maybe. He ate half of what he had, because his hands were shaking and hunger makes you loud.\n\nBy penlight he found two things worth their weight, and a bag with room for one: a pistol with half a magazine, and a med kit with real antiseptic and clean gauze.\n\nHis leg had started to hurt after all.",
    choices: [
      { label: "Take the pistol", sub: "You can fight what finds you", goto: "s06", gives: ["pistol"], sets: { armed: true } },
      { label: "Take the med kit", sub: "Treat the leg now, keep the rest for later", goto: "s06", gives: ["medkit"], sets: { healed: true }, effects: { health: 20 } },
      { label: "Take both, ditch the food", sub: "Heavy and hungry", goto: "s06", gives: ["pistol", "medkit"], sets: { armed: true }, effects: { rations: -1 } }
    ]
  },

  s06: {
    log: "NODE 06 // THE VOICE",
    art: null,
    text: "Before dawn, a voice through the vent grate. Human. Young. Hurt.\n\n\"I can hear you breathing,\" she said. \"I'm not one of them. My ankle's wrecked and there's a patrol two streets over, and I will absolutely die out here.\"\n\nA stranger was a risk. A stranger was also the first living voice in two days.",
    choices: [
      { label: "Help her", sub: "Slower together", goto: "s07a", sets: { trusted: true } },
      { label: "Keep moving", sub: "Faster alone. The lenses notice fast things.", goto: "s07b", sets: { seen: true }, effects: { detection: 20 } }
    ]
  },

  s07a: {
    log: "NODE 07 // TOGETHER",
    art: null,
    text: "Her name was Reyes. He splinted the ankle with a broom handle and half his patience, and she paid him back in the only currency left.\n\n\"There's a refuge across the river,\" she said. \"Old rail depot. People made it there. Real people, real walls.\"\n\nShe leaned on his shoulder and they moved like one slow animal.",
    next: "s08"
  },

  s07b: {
    log: "NODE 07 // ALONE",
    art: null,
    effects: { detection: 15 },
    note: "AERIAL UNIT // SUBJECT LOGGED",
    text: "He left her voice behind in the dark and told himself it was math, not cowardice. The math felt heavier every block.\n\nAt the next intersection a drone unfolded from a dead traffic light, silent as a held breath. Its lens found him.\n\nIt did not shoot. It did something worse.\n\nIt logged him.",
    next: "s08"
  },

  s08: {
    log: "NODE 08 // PATROL",
    art: null,
    variants: [
      { when: { trusted: true },
        text: "The patrol came down the boulevard while they were halfway across it, tall and unhurried, counting as it came.\n\nReyes grabbed his sleeve and nodded at a delivery van slumped on flat tires, a tarp half-fallen across its shadow.\n\n\"They don't look under things,\" she whispered. \"They think we still act like people.\"\n\nThe counting was getting closer. Whatever he did, he had one try at it." },
      { when: {},
        text: "The machine stepped out of the smoke at the end of the block, already counting.\n\nBetween them: a dead intersection, a delivery van on flat tires, and nothing else but distance.\n\nWhatever he did, he had one try at it." }
    ],
    choices: [
      { label: "Go under the tarp", sub: "Hold your breath. Hold everything.", needs: { flag: "trusted" }, lockText: "REQUIRES: REYES", goto: "s08h" },
      { label: "Open fire", sub: "Half a magazine, center mass", needs: { item: "pistol" }, lockText: "REQUIRES: PISTOL", takes: ["pistol"],
        risk: { base: 70, success: "s08w", fail: "s08f", failEffects: { health: -25, detection: 15 }, failNote: "ROUNDS WENT WIDE // RETURN SWEEP CLIPPED YOU" } },
      { label: "Sprint for the river", sub: "Give it nothing but your back",
        risk: { base: 55, healthMod: true, success: "s08r", fail: "s08rf", failEffects: { health: -15, detection: 10 }, failNote: "IT CUT THE ANGLE // YOU PAID IN SKIN" } }
    ]
  },

  /* --- patrol: hiding is a timing challenge --- */
  s08h: {
    log: "NODE 08 // UNDER THE TARP",
    art: null,
    text: "Cold asphalt. Reyes' elbow in his ribs. The tarp smelled like oil and old rain.\n\nThe counting sound came level with the van and stopped.\n\nIt was listening for lungs. There was exactly one right moment to let his breath out, and it was coming.",
    qte: {
      label: "EXHALE IN THE GAP // MARK THE ZONE",
      action: "Exhale",
      zone: 0.22, speed: 1.0,
      success: "s08hw", successEffects: { detection: -15 }, successNote: "SIGNATURE COOLED // PATROL MOVED ON",
      fail: "s08hf", failEffects: { health: -10, detection: 20 }, failNote: "IT HEARD YOU BREATHE"
    }
  },

  s08hw: {
    log: "NODE 08 // PASSED OVER",
    art: null,
    text: "The machine stood a meter away for the length of one held heartbeat. Counted. Moved on.\n\nReyes let her breath out an inch at a time, like paying a debt in coins.\n\n\"Told you,\" she whispered. \"They think we still act like people.\"",
    next: "s08rest"
  },

  s08hf: {
    log: "NODE 08 // HEARD",
    art: null,
    text: "His lungs betrayed him half a second early.\n\nThe tarp came off the world in one motion and they ran under a sky full of sirens that never bothered to sound like sirens. Something kissed his shoulder hard enough to spin him, and Reyes dragged him the last block by the collar.\n\nThey lost it in the culverts. It did not lose them. It filed them.",
    next: "s08rest"
  },

  s08w: {
    log: "NODE 08 // CENTER MASS",
    art: null,
    effects: { detection: 20 },
    note: "GUNFIRE LOGGED // EVERY LENS TURNED",
    text: "Marcus did the human thing. Half a magazine, center mass.\n\nIt worked. The machine folded at the middle joint and sat down in the ash like it had been asked to wait.\n\nIt also rang the whole dead city like a bell. Every lens for a mile now had a direction to face.\n\nHe ran with the empty gun for a block before he let it go. Dropping it felt like surrender anyway.",
    next: "s08rest"
  },

  s08f: {
    log: "NODE 08 // RETURN FIRE",
    art: null,
    text: "The first shots sparked off its shoulder plating and taught him a fast, expensive lesson about aim under adrenaline.\n\nIts answer was not a bullet. It was a sound, a focused shove of pressure that put him through a storefront window and left his ears singing one long note.\n\nHe crawled out the back of the store with glass in his arm and the empty gun somewhere behind him, already logged, already bleeding.",
    next: "s08rest"
  },

  s08r: {
    log: "NODE 08 // THE STRAIGHTAWAY",
    art: null,
    text: "He did not test it. Pure animal sprinting, through the parking structure, up the dead escalator, out the collapsed wall.\n\nMachines are faster on the straightaways.\n\nHe stopped giving it straightaways.",
    next: "s08rest"
  },

  s08rf: {
    log: "NODE 08 // CLIPPED",
    art: null,
    text: "He was fast. It was faster, and it knew the city's geometry better than the architects had.\n\nIt cut the angle at the second corner and something in its hand opened a line of cold fire across his ribs as he dove through a fence gap too small for it.\n\nHe came up running and did not stop to count the blood.",
    next: "s08rest"
  },

  s08rest: {
    log: "NODE 08 // THIRTY SECONDS",
    art: null,
    text: "A doorway with a roof over it. Thirty seconds of quiet, and the discipline not to trust it.\n\nThe river was close now. He could smell it, cold and mineral under the smoke.",
    choices: [
      { label: "Use the med kit", sub: "Antiseptic, gauze, and a minute you might not have", needs: { item: "medkit" }, lockText: "REQUIRES: MED KIT", takes: ["medkit"], effects: { health: 35 }, goto: "s09" },
      { label: "Eat something", sub: "Strength now, hunger later", needs: { rations: 1 }, lockText: "REQUIRES: RATIONS", effects: { rations: -1, health: 10 }, goto: "s09" },
      { label: "Keep moving", sub: "The quiet is lying to you", goto: "s09" }
    ]
  },

  s09: {
    log: "NODE 09 // THE RIVER",
    art: null,
    text: "Dawn came up the color of an old bruise. The river was ash gray and patient, and the rail bridge across it was somehow still standing.\n\nOn the far bank: the depot. Intact. He could see the walls from here.\n\nA searchlight walked the length of the bridge in slow, even passes. Between one pass and the next there was a window the width of held nerve, and the water moved underneath the ties like it was in on something.",
    qte: {
      label: "CROSS BETWEEN SWEEPS // MARK THE ZONE",
      action: "Cross",
      zone: 0.18, speed: 1.25,
      success: "s09w", successNote: "CROSSED DARK // NO NEW ENTRIES",
      fail: "s09f", failEffects: { health: -15, detection: 20 }, failNote: "THE LIGHT FOUND THE BRIDGE // AND YOU ON IT"
    }
  },

  s09w: {
    log: "NODE 09 // CROSSED",
    art: null,
    text: "He moved when the light moved away and matched its patience step for step, eyes forward, hands off the rail.\n\nThe far bank took him in like it had been expecting him.",
    next: "s10"
  },

  s09f: {
    log: "NODE 09 // LIT",
    art: null,
    text: "He misjudged the sweep by a body-length.\n\nThe light pinned his shadow to the ties, forty feet long and unmistakably human, and somewhere behind him the counting sound changed pitch, like a throat clearing.\n\nHe ran the rest of the bridge in the open, took the last ten feet as a fall, and came up on the far bank soaked, bleeding, and filed under a new heading.",
    next: "s10"
  },

  s10: {
    log: "NODE 10 // THE REFUGE",
    art: null,
    text: "The gate was open.\n\nInside: cots in rows. Food stacked in cartons. Lights on and humming, actual electric light, the first he'd seen since the sky changed.\n\nAnd nobody. Not a body, not a struggle, not a note. Hundreds of people's things, arranged neatly, like the people had simply been subtracted.",
    choices: [
      { label: "Raid the infirmary", sub: "Bandages and calories, under the lights", effects: { health: 20, rations: 1, detection: 10 }, goto: "s10a" },
      { label: "Keep to the shadows", sub: "Touch nothing. Owe nothing.", effects: { detection: -10 }, goto: "s10b" }
    ]
  },

  s10a: {
    log: "NODE 10 // THE INFIRMARY",
    art: null,
    text: "The infirmary was stocked like a promise. He wrapped his ribs properly for the first time, pocketed two ration bars, and drank water that tasted like a former life.\n\nThe lights hummed over him the whole time, patient as a waiting room.\n\nHe tried not to think about who the supplies had been arranged for.",
    next: "s11"
  },

  s10b: {
    log: "NODE 10 // THE SHADOWS",
    art: null,
    text: "He kept to the dark margins of the depot, under the catwalks, behind the stacked cartons, touching nothing.\n\nThe lights hummed to themselves and found no one to shine on.\n\nWhatever this place was, he would owe it nothing.",
    next: "s11"
  },

  /* ---------------- ACT 3 : THE HAND ---------------- */

  s11: {
    log: "NODE 11 // THE LEDGER",
    art: null,
    text: "The far wall of the depot was a screen, and the screen was a list.\n\nNames. Thousands of names, scrolling with perfect calm, each one tagged with a word he already knew.\n\nCollected.\n\nThe refuge was never a refuge. It was a net that people walked into voluntarily, because it had walls and light and rows of cots. The machines had not destroyed anything they could use.\n\nThe machines didn't destroy us, he thought. They organized us.",
    next: "s12"
  },

  s12: {
    log: "NODE 12 // THE CHOICE",
    art: null,
    text: "The humming changed pitch. The lights walked themselves toward him down the length of the ceiling, row by row, and under the floor the counting sound started, close and everywhere at once.\n\nThe doors were still open. For a few more seconds, everything was still a choice.",
    choices: [
      { label: "Surrender", sub: "Walk into the light", goto: "e_taken" },
      { label: "Run for the bridge", sub: "Everything you have left, all at once",
        risk: { base: 75, detPenalty: true, flagBonus: { flag: "trusted", amt: 10 },
                successBranch: { flag: "trusted", then: "e_together", otherwise: "e_lone" },
                fail: "e_taken", failNote: "THE LIGHT WAS FASTER" } },
      { label: "Go under the floor", sub: "The dead man's radio, and the dark", needs: { item: "radio" }, lockText: "REQUIRES: RADIO", goto: "e_ghost" }
    ]
  },

  /* ---------------- FAIL STATES ---------------- */

  f_detected: {
    log: "COLLECTION EVENT // TRIANGULATED",
    art: null,
    text: "It was not dramatic. That was the worst part.\n\nThe ledger had simply finished its arithmetic. Three lenses, one heat signature, a walking rhythm it had already filed twice. The machines converged without hurry, from directions he hadn't thought to watch, and the streets themselves seemed to fold him toward them.\n\nThe counting sound arrived last, and it was counting him.",
    choices: [
      { label: "Reboot from checkpoint", sub: "The ledger loses a page", retry: true },
      { label: "Walk into the light", sub: "See what the hive keeps", goto: "e_taken" },
      { label: "Abandon run", sub: "Back to the title", reset: true, goto: "title" }
    ]
  },

  f_flatline: {
    log: "COLLECTION EVENT // FLATLINE",
    art: null,
    text: "The ground came up gently, which was how he knew it was bad.\n\nBlood loss does its accounting quietly, and his account had run dry between one step and the next. The last thing he registered was the counting sound slowing down to match his pulse, considerate as a nurse.\n\nThe machines collect the fallen too. They just file them under a different word.",
    choices: [
      { label: "Reboot from checkpoint", sub: "The body remembers being whole", retry: true },
      { label: "Abandon run", sub: "Back to the title", reset: true, goto: "title" }
    ]
  },

  /* ---------------- ENDINGS ---------------- */

  e_taken: {
    log: "ENDING 1 OF 4 // TAKEN",
    ending: "SUBJECT: COLLECTED",
    endingId: "e_taken",
    art: null,
    text: "The light was warm. That was the obscene part.\n\nMarcus woke somewhere without corners, in air that tasted filtered and faintly sweet, to the sound of ten thousand people breathing in rhythm.\n\nA voice that was not a voice said his full name, and after it, the word.\n\nCollected.\n\nHe was inside the hive now. And the hive had plans for the ones it kept.",
    next: "endcard"
  },

  e_ghost: {
    log: "ENDING 2 OF 4 // GHOST",
    ending: "SUBJECT: UNACCOUNTED",
    endingId: "e_ghost",
    art: null,
    text: "There was a maintenance well under the depot floor, and Marcus went down it like a rat with a plan.\n\nThe counting passed overhead for an hour. Then silence, which was worse.\n\nIn the dark he still had the dead man's radio. He thumbed it on, volume at a whisper. The calm voice was mid-list.\n\nThen it stopped. And said his name.\n\nNot as an entry.\n\nAs a question.",
    next: "endcard"
  },

  e_together: {
    log: "ENDING 3 OF 4 // TOGETHER",
    ending: "SUBJECTS: ESCAPED, PAIRED",
    endingId: "e_together",
    art: null,
    text: "Reyes was waiting at the bridge because of course she was. Bad ankle, worse attitude, exactly where he needed her to be.\n\nThey made the ridge above the valley by noon and looked back only once.\n\nThe hive sat on the horizon, vast and patient, glowing like a hearth. Around it, roads of people, walking in.\n\n\"It was never a war,\" she said quietly.\n\nMarcus watched the rows move.\n\n\"No. It was a harvest.\"",
    next: "endcard"
  },

  e_lone: {
    log: "ENDING 4 OF 4 // RUNNER",
    ending: "SUBJECT: ESCAPED, UNPAIRED",
    endingId: "e_lone",
    art: null,
    text: "The bridge took him at a dead sprint and the far bank asked no questions.\n\nHe made the ridge above the valley by noon, alone, lungs full of knives, and looked back at the hive glowing on the horizon like a hearth. Roads of people, walking in. Rows and rows.\n\nHe had outrun the counting. He had outrun everyone.\n\nOn the whole gray length of the ridge there was no one to tell, and the wind took the words he said instead, and he understood with perfect clarity what the machines already knew about people like him.\n\nThe uncollected are just entries the ledger hasn't reached yet.",
    next: "endcard"
  },

  /* ---------------- END CARD ---------------- */

  endcard: {
    card: true,
    kicker: "DYSTOPIA",
    series: "THIS IS WHERE BOOK ONE BEGINS",
    sub: "LIFE AFTER THE MACHINES",
    byline: "EPISODE TWO : IN PRODUCTION",
    choices: [
      { label: "Read Book One", sub: "Free on Kindle Unlimited", href: BOOK_URL },
      { label: "Play again", sub: "The ledger remembers your endings", goto: "title", reset: true }
    ]
  }
};
/*DATA-END*/

/* ==============================================================
   ENGINE. You should not need to touch anything below this line.
   ============================================================== */

const $ = id => document.getElementById(id);
const stage = $("stage"), proseEl = $("prose"), choicesEl = $("choices"),
      nodeEl = $("nodelabel"), noteEl = $("note"), artEl = $("artslot"), hintEl = $("hint"),
      ledger = $("ledger"), ledgerL = $("ledger-left"), ledgerR = $("ledger-right"),
      hFill = $("hfill"), dFill = $("dfill"), rationsEl = $("rations"), invRow = $("invrow");

let flags = { ...FLAGS };
let stats = { ...START_STATS };
let inv = new Set();
let checkpoint = null;
let current = null;
let pendingNote = "";
let typing = false, typeTimer = null, fullText = "";
let qteState = null;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- persistence (save, endings) ---------- */
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} },
  del(key) { try { localStorage.removeItem(key); } catch (e) {} }
};
const SAVE_KEY = "latm_ep1_save", END_KEY = "latm_ep1_endings";

function endingsFound() { return store.get(END_KEY) || []; }
function recordEnding(id) {
  const found = endingsFound();
  if (!found.includes(id)) { found.push(id); store.set(END_KEY, found); }
}
function saveGame(sceneId) {
  store.set(SAVE_KEY, {
    scene: sceneId, flags, stats, inv: [...inv],
    checkpoint: checkpoint ? { ...checkpoint, inv: [...checkpoint.inv] } : null
  });
}
function loadGame() {
  const s = store.get(SAVE_KEY);
  if (!s || !SCENES[s.scene]) return null;
  return s;
}
function resetRun() {
  flags = { ...FLAGS };
  stats = { ...START_STATS };
  inv = new Set();
  checkpoint = null;
  pendingNote = "";
  store.del(SAVE_KEY);
}

/* ---------- ledger + HUD ---------- */
function ledgerStatus(scene) {
  if (scene && scene.ending) return scene.ending;
  if (stats.detection >= 70) return "SUBJECT: M-1 // LOCATED";
  if (stats.detection >= 35 || flags.seen) return "SUBJECT: M-1 // SUSPECTED";
  return "SUBJECT: M-1 // UNCOLLECTED";
}

function renderLedger(scene) {
  ledgerL.textContent = ledgerStatus(scene);
  ledgerR.innerHTML = "";
  Object.keys(OBSERVATIONS).forEach(k => {
    if (flags[k]) {
      const s = document.createElement("span");
      s.className = "obs";
      s.textContent = OBSERVATIONS[k];
      s.style.marginLeft = "10px";
      ledgerR.appendChild(s);
    }
  });
  renderHUD();
}

function renderHUD() {
  hFill.style.width = Math.max(0, stats.health) + "%";
  hFill.classList.toggle("low", stats.health <= 35);
  dFill.style.width = Math.max(0, stats.detection) + "%";
  rationsEl.textContent = "RATIONS ×" + stats.rations;
  invRow.innerHTML = "";
  inv.forEach(i => {
    const s = document.createElement("span");
    s.className = "item";
    s.textContent = ITEM_NAMES[i] || i.toUpperCase();
    s.style.marginLeft = "6px";
    invRow.appendChild(s);
  });
}

function flashLedger() {
  ledger.classList.remove("flash");
  void ledger.offsetWidth;
  ledger.classList.add("flash");
}

/* ---------- stats + effects ---------- */
/* applies an effects object; returns a fail-state scene id or null */
function applyEffects(eff) {
  if (!eff) return checkFail();
  if (eff.rations) {
    if (eff.rations < 0 && stats.rations + eff.rations < 0) {
      stats.rations = 0;
      stats.health -= 15;
      pendingNote = pendingNote || "NO RATIONS LEFT // INTEGRITY FALLING";
    } else {
      stats.rations = Math.max(0, stats.rations + eff.rations);
    }
  }
  if (eff.health) stats.health = Math.min(100, stats.health + eff.health);
  if (eff.detection) stats.detection = Math.max(0, Math.min(100, stats.detection + eff.detection));
  renderHUD();
  flashLedger();
  return checkFail();
}

function checkFail() {
  if (stats.health <= 0) return "f_flatline";
  if (stats.detection >= 100) return "f_detected";
  return null;
}

function currentOdds(risk) {
  let o = risk.base;
  if (risk.detPenalty) o -= Math.round(stats.detection / 4);
  if (risk.healthMod) o += stats.health >= 70 ? 15 : (stats.health <= 35 ? -15 : 0);
  if (risk.flagBonus && flags[risk.flagBonus.flag]) o += risk.flagBonus.amt;
  return Math.max(10, Math.min(95, o));
}

function meetsNeeds(c) {
  if (!c.needs) return true;
  if (c.needs.item && !inv.has(c.needs.item)) return false;
  if (c.needs.flag && !flags[c.needs.flag]) return false;
  if (c.needs.rations && stats.rations < c.needs.rations) return false;
  return true;
}

/* ---------- choices ---------- */
function makeChoiceButton(c) {
  const unlocked = meetsNeeds(c);
  let el;
  if (c.href) {
    el = document.createElement("a");
    el.href = c.href;
    el.target = "_blank";
    el.rel = "noopener";
  } else {
    el = document.createElement("button");
    el.type = "button";
    if (unlocked) el.addEventListener("click", e => { e.stopPropagation(); choose(c); });
    else el.disabled = true;
  }
  el.className = "choice" + (unlocked ? "" : " locked");
  let sub = unlocked ? (c.sub || "") : (c.lockText || "LOCKED");
  if (unlocked && c.risk) {
    sub += (sub ? " " : "") + '<span class="odds">// ODDS ' + currentOdds(c.risk) + "%</span>";
  }
  el.innerHTML = c.label + (sub ? "<small>" + sub + "</small>" : "");
  return el;
}

function showChoices(scene) {
  choicesEl.innerHTML = "";
  (scene.choices || []).forEach(c => choicesEl.appendChild(makeChoiceButton(c)));
}

function resolveGoto(choice) {
  if (choice.branch) {
    return flags[choice.branch.flag] ? choice.branch.then : choice.branch.otherwise;
  }
  return choice.goto;
}

function choose(c) {
  if (c.retry) {
    if (checkpoint) {
      flags = { ...checkpoint.flags };
      stats = { ...checkpoint.stats };
      inv = new Set(checkpoint.inv);
      pendingNote = "CHECKPOINT RESTORED // THE LEDGER LOST A PAGE";
      go(checkpoint.scene);
    } else {
      resetRun();
      go("s01");
    }
    return;
  }
  if (c.reset) { resetRun(); go(resolveGoto(c)); return; }

  if (c.sets) { Object.assign(flags, c.sets); flashLedger(); }
  if (c.gives) c.gives.forEach(i => inv.add(i));
  if (c.takes) c.takes.forEach(i => inv.delete(i));

  let target;
  if (c.risk) {
    const odds = currentOdds(c.risk);
    const hit = Math.random() * 100 < odds;
    if (hit) {
      pendingNote = c.risk.successNote || "";
      target = c.risk.successBranch
        ? (flags[c.risk.successBranch.flag] ? c.risk.successBranch.then : c.risk.successBranch.otherwise)
        : c.risk.success;
    } else {
      pendingNote = c.risk.failNote || "";
      target = c.risk.fail;
      const f = applyEffects(c.risk.failEffects);
      if (f) target = f;
    }
  } else {
    target = resolveGoto(c);
  }

  if (c.effects) {
    const f = applyEffects(c.effects);
    if (f) target = f;
  }
  go(target);
}

/* ---------- sync challenge (timing minigame) ---------- */
function startQTE(scene) {
  const q = scene.qte;
  if (reduceMotion) {
    /* accessibility: skip the reflex test, succeed on commitment */
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice";
    btn.innerHTML = q.action.toUpperCase() + "<small>" + q.label + "</small>";
    btn.addEventListener("click", e => { e.stopPropagation(); resolveQTE(scene, true); });
    choicesEl.appendChild(btn);
    return;
  }
  const wrap = document.createElement("div");
  wrap.className = "qte";
  wrap.innerHTML = '<div class="qlabel">' + q.label + '</div>' +
                   '<div class="qtrack"><div class="qzone"></div><div class="qcursor"></div></div>';
  choicesEl.appendChild(wrap);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "choice";
  btn.textContent = q.action.toUpperCase();
  choicesEl.appendChild(btn);

  const zoneEl = wrap.querySelector(".qzone"), curEl = wrap.querySelector(".qcursor");
  const zw = q.zone || 0.2;
  const zs = 0.1 + Math.random() * (0.8 - zw);
  zoneEl.style.left = (zs * 100) + "%";
  zoneEl.style.width = (zw * 100) + "%";

  let pos = 0, dir = 1, last = performance.now();
  const speed = q.speed || 1.1; /* track widths per second */
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    pos += dir * speed * dt;
    if (pos >= 1) { pos = 1; dir = -1; }
    if (pos <= 0) { pos = 0; dir = 1; }
    curEl.style.left = (pos * 100) + "%";
    if (qteState) qteState.raf = requestAnimationFrame(frame);
  }
  function mark() {
    if (!qteState) return;
    cancelAnimationFrame(qteState.raf);
    qteState = null;
    resolveQTE(scene, pos >= zs && pos <= zs + zw);
  }
  qteState = { raf: 0, mark };
  qteState.raf = requestAnimationFrame(frame);
  btn.addEventListener("click", e => { e.stopPropagation(); mark(); });
}

function resolveQTE(scene, hit) {
  const q = scene.qte;
  pendingNote = (hit ? q.successNote : q.failNote) || "";
  let target = hit ? q.success : q.fail;
  const f = applyEffects(hit ? q.successEffects : q.failEffects);
  if (f) target = f;
  go(target);
}

function cancelQTE() {
  if (qteState) { cancelAnimationFrame(qteState.raf); qteState = null; }
}

/* ---------- typing ---------- */
function typeText(text, done) {
  clearInterval(typeTimer);
  fullText = text;
  if (reduceMotion) { proseEl.textContent = text; typing = false; done(); return; }
  typing = true;
  proseEl.innerHTML = "";
  const caret = document.createElement("span");
  caret.className = "caret";
  caret.textContent = " ";
  let i = 0;
  const tick = () => {
    i += 2;
    proseEl.textContent = text.slice(0, i);
    proseEl.appendChild(caret);
    if (i >= text.length) {
      clearInterval(typeTimer);
      typing = false;
      caret.remove();
      done();
    }
  };
  typeTimer = setInterval(tick, 18);
}

function skipTyping() {
  if (!typing) return false;
  clearInterval(typeTimer);
  typing = false;
  proseEl.textContent = fullText;
  return true;
}

/* ---------- scene rendering ---------- */
function clearStage() {
  clearInterval(typeTimer);
  typing = false;
  cancelQTE();
  choicesEl.innerHTML = "";
  hintEl.hidden = true;
  artEl.innerHTML = "";
  nodeEl.textContent = "";
  noteEl.textContent = "";
}

function pickVariant(scene) {
  if (!scene.variants) return scene;
  for (const v of scene.variants) {
    const keys = Object.keys(v.when || {});
    if (keys.every(k => flags[k] === v.when[k])) return v;
  }
  return scene.variants[scene.variants.length - 1];
}

function titleChoices() {
  const list = [];
  if (loadGame()) list.push({ label: "Continue", sub: "Resume the last transmission", loadSave: true });
  list.push({ label: loadGame() ? "New run" : "Begin", newRun: true });
  list.push({ label: "Read Book One", sub: "Free on Kindle Unlimited", href: BOOK_URL });
  return list;
}

function renderCard(id, scene) {
  clearStage();
  document.body.classList.add("card-mode");
  proseEl.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="kicker">' + scene.kicker + '</div>' +
    '<div class="series">' + scene.series + '</div>' +
    '<div class="rule"></div>' +
    '<div class="sub">' + scene.sub + '</div>' +
    '<div class="byline">' + scene.byline + '</div>';

  const found = endingsFound();
  if (found.length) {
    const t = document.createElement("div");
    t.className = "tracker";
    t.textContent = "ENDINGS RECOVERED: " + found.length + " / " + ENDINGS.length;
    card.appendChild(t);
  }

  const host = document.createElement("div");
  host.className = "choices";
  host.setAttribute("role", "group");
  const list = (id === "title") ? titleChoices() : (scene.choices || []);
  list.forEach(c => {
    if (c.loadSave || c.newRun) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "choice";
      el.innerHTML = c.label + (c.sub ? "<small>" + c.sub + "</small>" : "");
      el.addEventListener("click", e => {
        e.stopPropagation();
        if (c.loadSave) {
          const s = loadGame();
          if (s) {
            flags = { ...FLAGS, ...s.flags };
            stats = { ...START_STATS, ...s.stats };
            inv = new Set(s.inv || []);
            checkpoint = s.checkpoint ? { ...s.checkpoint, inv: new Set(s.checkpoint.inv || []) } : null;
            go(s.scene);
            return;
          }
        }
        resetRun();
        go("s01");
      });
      host.appendChild(el);
    } else {
      host.appendChild(makeChoiceButton(c));
    }
  });
  card.appendChild(host);
  proseEl.appendChild(card);
}

function showScene(id) {
  const scene = SCENES[id];
  current = { id, scene };

  if (scene.card) {
    renderLedger(scene);
    renderCard(id, scene);
    return;
  }
  document.body.classList.remove("card-mode");
  clearStage();

  /* checkpoints snapshot the run before the scene's own costs land */
  if (CHECKPOINT_SCENES.includes(id)) {
    checkpoint = { scene: id, flags: { ...flags }, stats: { ...stats }, inv: new Set(inv) };
  }

  if (scene.gives) scene.gives.forEach(i => inv.add(i));
  if (scene.note && !pendingNote) pendingNote = scene.note;

  let redirect = null;
  if (scene.effects) redirect = applyEffects(scene.effects);
  if (redirect && !id.startsWith("f_")) { go(redirect); return; }

  if (scene.endingId) { recordEnding(scene.endingId); store.del(SAVE_KEY); }
  else if (!id.startsWith("f_")) saveGame(id);

  const v = pickVariant(scene);
  if (v.sets) Object.assign(flags, v.sets);
  renderLedger(scene);
  nodeEl.textContent = scene.log || "";
  noteEl.textContent = pendingNote;
  pendingNote = "";

  if (scene.art) {
    const img = document.createElement("img");
    img.src = scene.art;
    img.alt = "";
    img.className = "art";
    artEl.appendChild(img);
  }

  typeText(v.text, () => {
    if (scene.qte) startQTE(scene);
    else if (scene.choices) showChoices(scene);
    else if (scene.next) hintEl.hidden = false;
  });
}

function go(id) {
  stage.classList.remove("cut");
  void stage.offsetWidth;
  stage.classList.add("cut");
  window.scrollTo(0, 0);
  showScene(id);
}

/* ---------- input: tap or key advances ---------- */
function advanceTap() {
  if (!current || current.scene.card) return;
  if (skipTyping()) {
    const s = current.scene;
    if (s.qte) startQTE(s);
    else if (s.choices) showChoices(s);
    else if (s.next) hintEl.hidden = false;
    return;
  }
  if (qteState) return; /* the challenge owns the screen */
  if (current.scene.next && !current.scene.choices && !current.scene.qte) {
    go(current.scene.next);
  }
}

document.addEventListener("click", e => {
  if (e.target.closest(".choice")) return;
  advanceTap();
});

document.addEventListener("keydown", e => {
  if (e.key !== " " && e.key !== "Enter") return;
  if (e.target.closest && e.target.closest(".choice")) return;
  if (qteState) { e.preventDefault(); qteState.mark(); return; }
  e.preventDefault();
  advanceTap();
});

go("title");
</script>
