<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DYSTOPIA: The Waking &mdash; A Life After The Machines Episode</title>
<meta name="description" content="Episode One: The Waking. A cinematic choice-driven episode set in the world of Life After The Machines. Your choices decide who survives.">
<style>
  :root{ --grn:#39ff88; --grn-dim:#1a7a44; --red:#ff3344; --amber:#ffb85c; --bg:#020604; --bone:#eef2ea; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--bg);
    font-family:"Courier New",ui-monospace,monospace;color:var(--grn);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;}
  canvas{display:block;position:fixed;inset:0;}
  /* scanlines */
  body::after{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px);}
  /* cinematic letterbox */
  .bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:20;transition:height .8s;}
  #barTop{top:0;} #barBot{bottom:0;}
  body.cine #barTop,body.cine #barBot{height:9vh;}

  /* dialogue */
  #dlg{position:fixed;left:50%;bottom:calc(9vh + 18px);transform:translateX(-50%);
    width:min(720px,92vw);text-align:center;z-index:30;pointer-events:none;}
  #speaker{font-size:12px;letter-spacing:4px;margin-bottom:6px;text-shadow:0 0 8px rgba(57,255,136,.7);}
  #speaker.reyes{color:var(--grn);} #speaker.marcus{color:var(--bone);}
  #speaker.ledger{color:var(--red);text-shadow:0 0 8px rgba(255,51,68,.7);}
  #subtitle{font-size:clamp(14px,2.4vw,19px);line-height:1.55;color:#e8f5ec;
    text-shadow:0 1px 2px #000,0 0 12px rgba(0,0,0,.9);}
  #subtitle.narr{font-style:italic;color:#cfe2d4;}
  #tapHint{position:fixed;right:16px;bottom:calc(9vh + 8px);font-size:10px;letter-spacing:2px;
    color:rgba(57,255,136,.5);z-index:30;opacity:0;transition:opacity .4s;}

  /* timed choices — the telltale signature */
  #choiceWrap{position:fixed;left:50%;bottom:calc(9vh + 14px);transform:translateX(-50%);
    width:min(860px,96vw);z-index:40;display:none;}
  #choiceTimer{height:3px;background:rgba(57,255,136,.18);margin:0 6px 10px;position:relative;}
  #choiceFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--grn);
    box-shadow:0 0 8px rgba(57,255,136,.8);}
  #choiceFill.hot{background:var(--red);box-shadow:0 0 8px rgba(255,51,68,.8);}
  #choiceRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .opt{flex:1 1 0;min-width:150px;max-width:260px;background:rgba(2,10,5,.85);
    border:1px solid var(--grn-dim);color:var(--grn);padding:12px 12px 10px;cursor:pointer;
    font:inherit;font-size:13px;letter-spacing:1px;text-transform:uppercase;text-align:center;
    transition:background .12s,border-color .12s,color .12s;}
  .opt:hover,.opt:focus-visible{background:var(--grn);color:#02150a;border-color:var(--grn);outline:none;}
  .opt .key{display:block;font-size:9px;opacity:.55;margin-bottom:5px;letter-spacing:3px;}
  .opt.silent{border-style:dashed;opacity:.85;}
  .opt small{display:block;text-transform:none;letter-spacing:0;font-size:11px;opacity:.65;margin-top:4px;}

  /* consequence toast */
  #toast{position:fixed;top:calc(9vh + 16px);left:18px;z-index:45;font-size:12px;letter-spacing:2px;
    color:var(--bone);background:rgba(2,10,5,.78);border-left:3px solid var(--grn);
    padding:10px 16px;opacity:0;transform:translateX(-12px);transition:all .45s;max-width:76vw;}
  #toast.show{opacity:1;transform:translateX(0);}
  #toast.ember{border-left-color:var(--red);}

  /* QTE */
  #qte{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);z-index:46;display:none;
    text-align:center;}
  #qteRing{width:120px;height:120px;border-radius:50%;border:3px solid var(--grn);margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;position:relative;
    box-shadow:0 0 24px rgba(57,255,136,.35),inset 0 0 18px rgba(57,255,136,.2);}
  #qteRing .k{font-size:22px;letter-spacing:2px;color:var(--bone);}
  #qteShrink{position:absolute;inset:-3px;border-radius:50%;border:3px solid rgba(255,51,68,.9);}
  #qteLabel{font-size:12px;letter-spacing:3px;color:var(--bone);text-shadow:0 0 10px #000;}
  #qteBar{width:180px;height:8px;border:1px solid var(--grn-dim);margin:10px auto 0;display:none;}
  #qteFill{height:100%;width:0;background:var(--grn);}

  /* screens */
  .screen{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:rgba(1,5,3,.92);padding:30px 20px;overflow-y:auto;}
  .screen h1{font-size:clamp(30px,7vw,52px);letter-spacing:14px;text-shadow:0 0 24px rgba(57,255,136,.6);}
  .screen h2{font-size:clamp(11px,2.2vw,14px);letter-spacing:6px;color:#9fd8b4;margin-top:14px;font-weight:normal;}
  .screen .mini{font-size:10px;letter-spacing:3px;color:rgba(57,255,136,.55);margin-top:10px;}
  .btn{font:inherit;margin-top:26px;background:transparent;border:1px solid var(--grn);color:var(--grn);
    padding:14px 34px;font-size:14px;letter-spacing:4px;cursor:pointer;text-transform:uppercase;
    text-decoration:none;display:inline-block;transition:all .15s;}
  .btn:hover{background:var(--grn);color:#02150a;box-shadow:0 0 24px rgba(57,255,136,.5);}
  .btn.amber{border-color:var(--amber);color:var(--amber);}
  .btn.amber:hover{background:var(--amber);color:#150a02;box-shadow:0 0 24px rgba(255,184,92,.5);}
  #deathTitle{color:var(--red);letter-spacing:10px;text-shadow:0 0 24px rgba(255,51,68,.6);}
  #choiceSummary{margin-top:22px;font-size:12px;letter-spacing:1px;color:#cfe2d4;text-align:left;
    max-width:520px;line-height:2;}
  #choiceSummary b{color:var(--grn);font-weight:normal;}
  #tracker{margin-top:16px;font-size:11px;letter-spacing:3px;color:var(--amber);}
  #cover{width:min(170px,40vw);aspect-ratio:2/3;border:1px solid var(--grn);margin-top:20px;
    position:relative;box-shadow:0 0 30px rgba(57,255,136,.25);}
  #coverImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
  #coverFallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:12px 8px;font-size:10px;letter-spacing:2px;}
  #fade{position:fixed;inset:0;background:#000;z-index:25;opacity:1;pointer-events:none;transition:opacity 1.2s;}
  #fade.white{background:#fff;}
  body.whiteout #subtitle{color:#101410;text-shadow:none;}
  body.whiteout #subtitle.narr{color:#2a2f2a;}
  body.whiteout #speaker.marcus{color:#101410;text-shadow:none;}
  body.whiteout #tapHint{color:rgba(0,0,0,.45);}
</style>
</head>

<div class="screen" id="startScreen" style="display:flex;">
  <h1>DYSTOPIA</h1>

    <div id="coverFallback">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============================================================
   CONFIG — edit without touching the engine.
   ============================================================ */
const CONFIG = {
  BOOK1_URL: 'https://www.amazon.com/dp/B0H2SGHFNN',
  COVER_URL: 'cover.jpg',
  CHOICE_SECONDS: 9,          // default timer on choices
};

/* ============================================================
   Renderer / core
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, .1, 600);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const $ = id => document.getElementById(id);
const el = {
  speaker:$('speaker'), subtitle:$('subtitle'), tapHint:$('tapHint'),
  choiceWrap:$('choiceWrap'), choiceRow:$('choiceRow'), choiceFill:$('choiceFill'),
  toast:$('toast'), qte:$('qte'), qteLabel:$('qteLabel'), qteShrink:$('qteShrink'),
  qteKey:$('qteKey'), qteBar:$('qteBar'), qteFill:$('qteFill'),
  start:$('startScreen'), startBtn:$('startBtn'), loadState:$('loadState'), ctlHint:$('ctlHint'),
  death:$('deathScreen'), deathSub:$('deathSub'), rewindBtn:$('rewindBtn'),
  end:$('endCard'), endingName:$('endingName'), choiceSummary:$('choiceSummary'),
  tracker:$('tracker'), bookBtn:$('bookBtn'), replayBtn:$('replayBtn'),
  fade:$('fade'), titleTracker:$('titleTracker'),
};
el.bookBtn.href = CONFIG.BOOK1_URL;
$('coverImg').src = CONFIG.COVER_URL;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
el.ctlHint.textContent = IS_TOUCH ? 'TAP TO ADVANCE · TAP CHOICES BEFORE THE TIMER RUNS OUT'
                                  : 'SPACE/CLICK ADVANCES · 1-4 OR CLICK CHOOSES · CHOOSE BEFORE THE TIMER RUNS OUT';

/* ============================================================
   Audio — tiny synthesized pad + stings (WebAudio)
   ============================================================ */
const Audio2 = (() => {
  let ac=null, padGain=null, hbTimer=null;
  function init(){
    if (ac) return;
    try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
    padGain = ac.createGain(); padGain.gain.value = .05; padGain.connect(ac.destination);
    [65.41, 98.0, 130.8].forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sawtooth'; o.frequency.value = f; g.gain.value = i? .12 : .3;
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220;
      o.connect(lp); lp.connect(g); g.connect(padGain); o.start();
    });
  }
  function blip(f, d=.07, v=.05, type='square'){
    if (!ac) return;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=v;
    o.connect(g); g.connect(ac.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d); o.stop(ac.currentTime+d);
  }
  function heartbeat(on){
    clearInterval(hbTimer); hbTimer=null;
    if (on && ac) hbTimer = setInterval(()=>{ blip(52,.1,.09,'sine'); setTimeout(()=>blip(48,.09,.07,'sine'),180); }, 900);
  }
  return { init, blip, heartbeat,
    sting(){ blip(392,.25,.06,'triangle'); setTimeout(()=>blip(311,.35,.06,'triangle'),140); },
    danger(){ blip(110,.3,.08,'sawtooth'); },
    resume(){ if (ac && ac.state==='suspended') ac.resume(); } };
})();

/* ============================================================
   Shared builders — procedural, in the engine's style
   ============================================================ */
const texLoader = new THREE.TextureLoader();
function canvasTex(draw, size=256){
  const c=document.createElement('canvas'); c.width=c.height=size;
  draw(c.getContext('2d'), size);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const unitBox = new THREE.BoxGeometry(1,1,1);
function box(scene, color, sx,sy,sz, x,y,z, opts={}){
  const m = new THREE.Mesh(unitBox, new THREE.MeshStandardMaterial({ color, roughness:opts.rough??.9, metalness:opts.metal??.1, emissive:opts.emissive??0 }));
  m.scale.set(sx,sy,sz); m.position.set(x,y,z);
  if (opts.ry) m.rotation.y = opts.ry;
  if (opts.rx) m.rotation.x = opts.rx;
  if (opts.rz) m.rotation.z = opts.rz;
  scene.add(m); return m;
}

function bloodSky(scene){
  const mat = new THREE.MeshBasicMaterial({ side:THREE.BackSide, fog:false, map:canvasTex((g,s)=>{
    const grd=g.createLinearGradient(0,s,0,0);
    grd.addColorStop(0,'#6e1c10'); grd.addColorStop(.35,'#571309');
    grd.addColorStop(.7,'#2a0a06'); grd.addColorStop(1,'#120404');
    g.fillStyle=grd; g.fillRect(0,0,s,s);
  })});
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(320,24,16), mat));
  texLoader.load('sky.jpg', tx => {
    tx.colorSpace=THREE.SRGBColorSpace; tx.wrapS=THREE.MirroredRepeatWrapping;
    tx.repeat.set(2,1.15); tx.offset.y=-.06; mat.map=tx; mat.needsUpdate=true;
  });
}

function ashGround(scene, color=0x241812){
  const g = new THREE.Mesh(new THREE.PlaneGeometry(600,600),
    new THREE.MeshStandardMaterial({ color, roughness:1 }));
  g.rotation.x = -Math.PI/2; scene.add(g); return g;
}

function rubbleField(scene, n=40, rMin=3, rMax=30){
  const mat = new THREE.MeshStandardMaterial({ color:0x2e2016, roughness:.95 });
  for (let i=0;i<n;i++){
    const m=new THREE.Mesh(unitBox, mat);
    const a=Math.random()*6.283, r=rMin+Math.random()*(rMax-rMin), s=.3+Math.random()*1.8;
    m.position.set(Math.sin(a)*r, s*.3, Math.cos(a)*r);
    m.scale.set(s, s*(.4+Math.random()*.5), s*(.5+Math.random()));
    m.rotation.y=Math.random()*3.14; scene.add(m);
  }
}

function burningCity(scene, dist=-120){
  const fl=[];
  for (let i=0;i<14;i++){
    const w=6+Math.random()*10, h=8+Math.random()*30;
    const b = box(scene, 0x0d0806, w,h,6, -70+i*11+Math.random()*4, h/2, dist+Math.random()*24);
    if (Math.random()<.5){
      const f = new THREE.PointLight(0xff5a22, 3+Math.random()*4, 40, 1.6);
      f.position.set(b.position.x, h*.6+Math.random()*h*.3, b.position.z+4);
      scene.add(f); fl.push(f);
    }
  }
  return t => fl.forEach((f,i)=>{ f.intensity = 3+2.4*Math.abs(Math.sin(t*3+i*2.1)); });
}

/* low-poly stylized human, phosphor-lit — same procedural spirit as the engine */
function makeHuman({jacket=0x3a4a3e, pants=0x2a2f2a, skin=0xb9a894, h=1.0}={}){
  const g = new THREE.Group();
  const mJ=new THREE.MeshStandardMaterial({color:jacket,roughness:.85});
  const mP=new THREE.MeshStandardMaterial({color:pants,roughness:.9});
  const mS=new THREE.MeshStandardMaterial({color:skin,roughness:.7});
  const mk=(mat,sx,sy,sz,x,y,z)=>{ const m=new THREE.Mesh(unitBox,mat); m.scale.set(sx,sy,sz); m.position.set(x,y,z); g.add(m); return m; };
  const legL=mk(mP,.13,.42,.15,-.09,.21,0), legR=mk(mP,.13,.42,.15,.09,.21,0);
  const torso=mk(mJ,.34,.44,.2,0,.64,0);
  const armL=mk(mJ,.09,.38,.12,-.24,.63,0), armR=mk(mJ,.09,.38,.12,.24,.63,0);
  const head=mk(mS,.16,.18,.16,0,.97,0);
  g.scale.setScalar(h*1.75);
  g.userData = { legL,legR,armL,armR,torso,head, mode:'idle', walkT:0 };
  g.userData.setMode = m => g.userData.mode = m;
  g.userData.tick = (dt,t) => {
    const u=g.userData;
    if (u.mode==='walk'){
      u.walkT += dt*7;
      legL.rotation.x =  Math.sin(u.walkT)*.6; legR.rotation.x = -Math.sin(u.walkT)*.6;
      armL.rotation.x = -Math.sin(u.walkT)*.5; armR.rotation.x =  Math.sin(u.walkT)*.5;
    } else if (u.mode==='idle'){
      legL.rotation.x=legR.rotation.x=0;
      armL.rotation.x = Math.sin(t*1.3)*.05; armR.rotation.x = Math.sin(t*1.3+1)*.05;
      torso.position.y = .64 + Math.sin(t*1.7)*.008;
    } else if (u.mode==='lie'){
      legL.rotation.x=legR.rotation.x=armL.rotation.x=armR.rotation.x=0;
    }
  };
  return g;
}

/* machine models with procedural fallback */
const MODELS = {};
const modelsReady = (async () => {
  const loader = new GLTFLoader();
  for (const name of ['crawler','sentry','warden','pod']){
    try {
      const gltf = await loader.loadAsync(`models/${name}.glb`);
      MODELS[name] = gltf.scene;
    } catch(e){ MODELS[name] = null; }
  }
})();
function machine(name, scale=1){
  let m;
  if (MODELS[name]) m = MODELS[name].clone(true);
  else {
    m = new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:0x39423a,roughness:.5,metalness:.6});
    const body=new THREE.Mesh(unitBox,mat); body.scale.set(.6,1.4,.5); body.position.y=1.1; m.add(body);
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8), new THREE.MeshBasicMaterial({color:0xff3344}));
    eye.position.set(0,1.6,.28); m.add(eye);
  }
  m.scale.setScalar(scale);
  return m;
}

/* ============================================================
   SETS — each returns {scene, actors, tick(dt,t)}
   ============================================================ */
const SETS = {

  lot(){
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x160604, .012);
    bloodSky(scene); ashGround(scene);
    rubbleField(scene, 46, 2.5, 28);
    const fires = burningCity(scene, -110);
    scene.add(new THREE.HemisphereLight(0x8a2a18, 0x120a06, 1.5));
    const sun = new THREE.DirectionalLight(0xff6a40, .55); sun.position.set(-40,25,-60); scene.add(sun);
    // overpass silhouette
    box(scene, 0x0f0a08, 60,1.6,7, 10,7.4,-46);
    [[-14,-46],[0,-46],[14,-46],[28,-46]].forEach(([x,z])=>box(scene,0x0f0a08,1.6,7,1.6,x,3.5,z));
    const marcus = makeHuman({});
    marcus.rotation.z = Math.PI/2; marcus.position.set(0,.18,0); marcus.userData.setMode('lie');
    scene.add(marcus);
    return { scene, actors:{marcus}, tick:(dt,t)=>{ fires(t); marcus.userData.tick(dt,t); } };
  },

  column(){
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x160604, .015);
    bloodSky(scene); ashGround(scene, 0x1c130d);
    scene.add(new THREE.HemisphereLight(0x8a2a18, 0x120a06, 1.4));
    // road below, column of machines herding people
    const walkers=[];
    for (let i=0;i<10;i++){
      const p = makeHuman({jacket:0x2c2c28, pants:0x232320, h:.98});
      p.position.set(-3 + (i%2)*1.2, 0, -6*i);
      p.userData.setMode('walk'); scene.add(p); walkers.push(p);
    }
    const guards=[];
    for (let i=0;i<3;i++){
      const w = machine('warden', 1.15); w.position.set(2.8, 0, -8-i*16); scene.add(w); guards.push(w);
    }
    const red = new THREE.PointLight(0xff3344, 8, 40, 1.6); red.position.set(2,6,-20); scene.add(red);
    return { scene, actors:{}, tick:(dt,t)=>{
      walkers.forEach(p=>{ p.position.z += dt*.9; if (p.position.z>4) p.position.z=-58; p.userData.tick(dt,t); });
      guards.forEach(g=>{ g.position.z += dt*.9; if (g.position.z>6) g.position.z=-56; });
      red.intensity = 7+2*Math.sin(t*2);

/* ============================================================
   Cinematic engine — beats, shots, choices, QTEs, toasts
   ============================================================ */
const G = {
  mode:'title', set:null, setName:'',
  bi:0, flags:{}, choices:[], checkpoint:null,
  camFrom:null, camTo:null, camLook:null, camT:0, camDur:0,
  waitTimer:0, sayTimer:0,
  t:0,
};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const END_KEY='latm_tt_endings';
const ENDINGS = { e_taken:'TAKEN', e_ghost:'GHOST', e_together:'TOGETHER', e_lone:'RUNNER' };
function endingsFound(){ return store.get(END_KEY)||[]; }
{
  const f=endingsFound();
  if (f.length) el.titleTracker.textContent = 'ENDINGS RECOVERED: '+f.length+' / 4';
}

function switchSet(name){
  G.setName = name;
  G.set = SETS[name]();
}
function shot(pos, look, dur=0){
  const p = new THREE.Vector3(...pos), l = new THREE.Vector3(...look);
  if (dur<=0){ camera.position.copy(p); camera.lookAt(l); G.camTo=null; G.camLook=l; return; }
  G.camFrom = { p:camera.position.clone(), l:(G.camLook||l).clone() };
  G.camTo = { p, l }; G.camT = 0; G.camDur = dur;
}
function camTick(dt){
  if (!G.camTo) return;
  G.camT += dt/G.camDur;
  const k = G.camT>=1?1:(G.camT*G.camT*(3-2*G.camT));
  camera.position.lerpVectors(G.camFrom.p, G.camTo.p, k);
  const look = new THREE.Vector3().lerpVectors(G.camFrom.l, G.camTo.l, k);
  camera.lookAt(look); G.camLook = look;
  if (G.camT>=1) G.camTo=null;
}

/* dialogue */
function say(who, text){
  el.speaker.textContent = who ? who : '';
  el.speaker.className = who ? who.toLowerCase() : '';
  el.subtitle.textContent = text;
  el.subtitle.className = who ? '' : 'narr';
  el.tapHint.style.opacity = .8;
  G.sayTimer = Math.max(3.4, text.length*.06);
  Audio2.blip(who==='LEDGER'?196:660,.03,.02);
}
function clearSay(){
  el.speaker.textContent=''; el.subtitle.textContent='';
  el.tapHint.style.opacity=0;
}

/* toast */
let toastTimer=null;
function toast(text, ember){
  el.toast.textContent = '◆ '+text;
  el.toast.className = 'show'+(ember?' ember':'');
  Audio2.sting();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.toast.className=''; }, 3400);
}

/* choices */
let choiceState=null;
function showChoice(c){
  G.mode='choice';
  el.choiceRow.innerHTML='';
  const opts = c.options.filter(o=>!o.req || G.flags[o.req]);
  function pick(o){
    el.choiceWrap.style.display='none';
    Audio2.heartbeat(false);
    choiceState=null;
    G.choices.push({ q:c.record||'', a:o.label });
    if (o.flags) Object.assign(G.flags, o.flags);
    if (o.toast) toast(o.toast, o.ember);
    G.mode='beat';
    if (o.goto) jump(o.goto); else step();
  }
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(o.silent?' silent':'');
    b.innerHTML = '<span class="key">'+(i+1)+'</span>'+o.label+(o.sub?'<small>'+o.sub+'</small>':'');
    b.onclick = e=>{ e.stopPropagation(); pick(o); };
    el.choiceRow.appendChild(b);
  });
  el.choiceWrap.style.display='block';
  choiceState = { c, opts, t: c.timer||CONFIG.CHOICE_SECONDS, pick };
  choiceState.total = choiceState.t;
  Audio2.heartbeat(true);
}
function choiceTick(dt){
  if (!choiceState) return;
  choiceState.t -= dt;
  const k = Math.max(0, choiceState.t/choiceState.total);
  el.choiceFill.style.width = (k*100)+'%';
  el.choiceFill.className = k<.33?'hot':'';
  if (choiceState.t<=0){
    const def = choiceState.opts.find(o=>o.silent) || choiceState.opts[choiceState.opts.length-1];
    choiceState.pick(def);
  }
}

/* QTE */
let qteState=null;
function showQTE(q){
  G.mode='qte';
  el.qte.style.display='block';
  el.qteLabel.textContent = q.label;
  el.qteKey.textContent = IS_TOUCH ? 'TAP' : (q.key||'SPACE');
  el.qteBar.style.display = q.mash ? 'block' : 'none';
  el.qteFill.style.width='0%';
  qteState = { q, t:0, window:q.window||1.7, hits:0, need:q.need||10 };
  Audio2.heartbeat(true);
  Audio2.danger();
}
function qteInput(){
  if (!qteState) return;
  const q = qteState.q;
  if (q.mash){
    qteState.hits++;
    Audio2.blip(520+qteState.hits*30,.04,.04);
    el.qteFill.style.width = Math.min(100, qteState.hits/qteState.need*100)+'%';
    if (qteState.hits>=qteState.need) resolveQTE(true);
  } else {
    resolveQTE(true);
  }
}
function qteTick(dt){
  if (!qteState) return;
  qteState.t += dt;
  const k = Math.max(0, 1-qteState.t/qteState.window);
  el.qteShrink.style.inset = (-3-(k*46))+'px';
  el.qteShrink.style.opacity = .25+.75*k;
  if (qteState.t>=qteState.window) resolveQTE(false);
}
function resolveQTE(hit){
  const q=qteState.q;
  qteState=null;
  el.qte.style.display='none';
  Audio2.heartbeat(false);
  G.mode='beat';
  if (hit){ Audio2.blip(880,.09,.05); if (q.okToast) toast(q.okToast); jump(q.ok); }
  else { Audio2.danger(); if (q.failToast) toast(q.failToast, true); jump(q.fail); }
}

/* death + retry */
function death(sub){
  G.mode='death';
  el.deathSub.textContent = sub || 'THE LEDGER HAS YOUR NAME.';
  el.death.style.display='flex';
  Audio2.danger();
}
el.rewindBtn.onclick = () => {
  el.death.style.display='none';
  if (G.checkpoint){
    G.flags = { ...G.checkpoint.flags };
    G.bi = G.checkpoint.bi;
    G.mode='beat';
    step();
  }
};

/* fades */
function fade(toBlack, dur=1.2){
  el.fade.style.transition = 'opacity '+dur+'s';
  el.fade.style.opacity = toBlack?1:0;
}

/* ============================================================
   Beat interpreter
   ============================================================ */
function jump(labelName){ G.bi = L[labelName]; step(); }
function step(){
  if (G.mode==='death' || G.mode==='end') return;
  const b = B[G.bi++];
  if (!b) return;
  if (b.set){ switchSet(b.set); return step(); }
  if (b.fade==='in'){ fade(false); return step(); }
  if (b.fade==='out'){ fade(true,.9); G.mode='wait'; G.waitTimer=1.0; return; }
  if (b.fadeWhite){ el.fade.className='white'; document.body.classList.add('whiteout'); fade(true,2.4); G.mode='wait'; G.waitTimer=2.4; return; }
  if (b.shot){ shot(b.shot.pos, b.shot.look, b.shot.dur); return step(); }
  if (b.flags){ Object.assign(G.flags, b.flags); return step(); }
  if (b.toastB){ toast(b.toastB[0], b.toastB[1]); return step(); }
  if (b.checkpoint){ G.checkpoint = { bi:G.bi, flags:{...G.flags} }; return step(); }
  if (b.goto){ return jump(b.goto); }
  if (b.branch){ return jump(G.flags[b.branch.flag] ? b.branch.then : b.branch.else); }
  if (b.say){ G.mode='say'; say(b.say[0], b.say[1]); return; }
  if (b.sayIf){
    if (G.flags[b.sayIf.flag]){ G.mode='say'; say(b.sayIf.who, b.sayIf.text); return; }
    return step();
  }
  if (b.choice){ clearSay(); return showChoice(b.choice); }
  if (b.qte){ clearSay(); return showQTE(b.qte); }
  if (b.death){ clearSay(); return death(b.death); }
  if (b.act){ return doAct(b); }
  if (b.ending){ return showEnding(b.ending); }
  step();
}

/* act handling — small set of scripted actions on the current set */
let actAnim=null;
function doAct(b){
  const a = b.act, A = G.set.actors;
  if (a.rise && A.marcus){
    const m = A.marcus;
    actAnim = { t:0, dur:a.dur||2, fn(k){
      m.rotation.z = (1-k)*Math.PI/2;
      m.position.y = .18*(1-k);
    }, done(){ m.userData.setMode('idle'); } };
    G.mode='wait'; G.waitTimer = a.dur||2;
    return;
  }
  if (a.grateOn && A.grateGlow){ A.grateGlow.userData.on = true; return step(); }
  if (a.sentryApproach && A.sentry){ A.sentry.userData.approach = true; return step(); }
  if (a.beamOn && A.beam){ A.beam.userData.on = true; return step(); }
  if (a.reyesVisible && A.reyes){
    A.reyes.visible = a.reyesVisible==='always' || !!G.flags.trusted;
    return step();
  }
  if (a.lights !== undefined && A.strips){ A.strips[0].userData.advance = a.lights; Audio2.danger(); return step(); }
  if (a.walkAcross && A.marcus){
    const m=A.marcus, r=A.reyes;
    m.userData.setMode('walk'); if (r&&r.visible) r.userData.setMode('walk');
    actAnim = { t:0, dur:a.dur||3, fn(k){
      m.position.z = 4 - k*30;
      if (r&&r.visible) r.position.z = 5.4 - k*30;
    }, done(){ m.userData.setMode('idle'); if(r) r.userData.setMode('idle'); } };
    shot([2.8,1.8,-8], [0,1.2,-30], a.dur||3);
    G.mode='wait'; G.waitTimer = a.dur||3;
    return;
  }
  step();
}

/* endings + end card */
function showEnding(id){
  const found = endingsFound();
  if (!found.includes(id)){ found.push(id); store.set(END_KEY, found); }
  G.mode='end';
  clearSay();
  document.body.classList.remove('cine');
  document.body.classList.remove('whiteout');
  el.endingName.textContent = 'ENDING: '+ENDINGS[id];
  el.choiceSummary.innerHTML = '<b>YOUR EPISODE:</b><br>' +
    G.choices.map(c=>'▸ '+c.q+' — <b>'+c.a.replace(/[\[\]]/g,'')+'</b>').join('<br>');
  el.tracker.textContent = 'ENDINGS RECOVERED: '+found.length+' / 4';
  el.end.style.display='flex';
}
el.replayBtn.onclick = () => location.reload();

/* ============================================================
   Input
   ============================================================ */
function advance(){
  if (G.mode==='say'){
    clearSay();
    G.mode='beat';
    step();
  } else if (G.mode==='qte'){
    qteInput();
  }
}
addEventListener('pointerdown', e => {
  if (e.target.closest('.btn')||e.target.closest('.opt')) return;
  if (G.mode==='qte'){ qteInput(); return; }
  advance();
});
addEventListener('keydown', e => {
  if (G.mode==='choice' && choiceState){
    const i = parseInt(e.key)-1;
    if (choiceState.opts[i]) { choiceState.pick(choiceState.opts[i]); return; }
  }
  if (e.key===' '||e.key==='Enter'){ e.preventDefault(); if (G.mode==='qte') qteInput(); else advance(); }
});

/* ============================================================
   Boot + main loop
   ============================================================ */
modelsReady.then(()=>{
  el.loadState.style.display='none';
  el.startBtn.style.display='inline-block';
});
el.startBtn.onclick = () => {
  Audio2.init(); Audio2.resume();
  el.start.style.display='none';
  document.body.classList.add('cine');
  G.mode='beat';
  el.fade.style.opacity=1;
  setTimeout(()=>step(), 80);
};

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; G.t+=dt;
  if (G.set){
    G.set.tick(dt, G.t);
    camTick(dt);
    if (actAnim){
      actAnim.t += dt;
      const k = Math.min(1, actAnim.t/actAnim.dur);
      actAnim.fn(k*k*(3-2*k));
      if (k>=1){ actAnim.done && actAnim.done(); actAnim=null; }
    }
    if (G.mode==='wait'){
      G.waitTimer -= dt;
      if (G.waitTimer<=0){ G.mode='beat'; step(); }
    }
    if (G.mode==='say'){
      G.sayTimer -= dt;
      if (G.sayTimer<=0) advance();
    }
    choiceTick(dt);
    qteTick(dt);
    renderer.render(G.set.scene, camera);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* debug/testing hook */
window.__TT = { G, B, L, jump, step, flags:()=>G.flags, choiceState:()=>choiceState, qteState:()=>qteState };
