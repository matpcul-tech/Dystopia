<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DYSTOPIA: The Waking</title>
<link rel="icon" href="data:,">
<meta name="description" content="The Waking, a playable episode of Dystopia: Life After The Machines.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="vig"></div>
<div id="hud">
  <div id="crosshair"></div>
  <div id="healthWrap">
    <div id="healthLabel">VITALS</div>
    <div id="healthBar"><div id="healthFill"></div></div>
  </div>
  <div id="detWrap">
    <div id="detLabel">DETECTION</div>
    <div id="detBar"><div id="detFill"></div></div>
  </div>
  <div id="perks"></div>
  <div id="objective"></div>
  <div id="bossWrap"><div id="bossName">HUNTER</div><div id="bossBar"><div id="bossFill"></div></div><div id="bossSub"></div></div>
  <div id="radio"></div>
  <div id="prompt"></div>
  <div id="plantWrap">
    <div id="plantLabel">ARMING CHARGE</div>
    <div id="plantBar"><div id="plantFill"></div></div>
  </div>
  <div id="dmgVignette"></div>
</div>
<div id="stickZone"></div>
<div id="lookZone"></div>
<div id="stickBase"><div id="stickNub"></div></div>
<button id="fireBtn" type="button">FIRE</button>
<button id="plantBtn" type="button">PLANT</button>
<div class="sbar" id="sbarTop"></div>
<div class="sbar" id="sbarBot"></div>
<div id="storyWrap">
  <div id="castStage"></div>
  <div id="storyDlg">
    <div id="sSpeaker"></div>
    <div id="sText"></div>
    <div id="sHint">TAP / SPACE</div>
  </div>
  <div id="sChoice">
    <div id="sTimer"><div id="sTimerFill"></div></div>
    <div id="sOpts"></div>
  </div>
</div>
<div id="sToast"></div>
<div id="overlays">
  <div id="redFade"></div>
  <div id="fade"></div>
  <div class="screen" id="startScreen">
    <div class="kicker"><i></i>BOOK ONE<i></i></div>
    <div class="eyeStage" aria-hidden="true">
      <div class="beam"></div>
      <div class="eye"></div>
    </div>
    <h1>DYSTOPIA</h1>
    <p class="deck">Life After The Machines</p>
    <p class="novel">A NOVEL</p>
    <h2>EPISODE ONE: THE WAKING</h2>
    <p class="tag">Humanity is not being exterminated. It is being harvested.</p>
    <button class="btn" id="startBtn" type="button">ENTER</button>
    <button class="btn small" id="cineGalBtn" type="button">CINEMATICS</button>
    <div id="startHint"></div>
  </div>
  <div class="screen" id="intro">
    <div id="introText"></div>
    <button id="skipBtn" type="button">SKIP</button>
  </div>
  <div class="screen" id="endCard">
    <div id="endName"></div>
    <div id="endTitle">Marcus's story continues.</div>
    <div id="cover">
      <div id="coverFallback">
        <div class="cTop">BOOK ONE</div>
        <div class="cTitle">DYSTOPIA</div>
        <div class="cItalic">Life After The Machines</div>
        <div class="miniEye"></div>
        <div class="cBottom">MATTHEW CULWELL</div>
      </div>
      <img id="coverImg" alt="Dystopia: Life After The Machines, Book One cover" width="700" height="1120">
    </div>
    <div id="endSub"></div>
    <div id="endSummary"></div>
    <div id="endTracker"></div>
    <div id="endBtns" style="margin-top:22px">
      <a class="btn amber" id="book1Btn" target="_blank" rel="noopener">READ BOOK 1</a>
      <button class="btn" id="replayBtn" type="button">REPLAY</button>
    </div>
  </div>
</div>
<script src="humans.js"></script>
<script src="cinematics.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
